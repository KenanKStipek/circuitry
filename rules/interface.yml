section: interface
summary: Optional top-level typed input/output contract for an orchestration. Makes it composable via use with validated inputs and auto-generated output mappings.
placement: "Top-level key, sibling of effects: (interface: then effects:)."
fields:
  inputs:
    type: object
    note: "Map of input-name -> {type, required, description}. OBJECT form per input, e.g. article_text: {type: string, required: true, description: ...}."
  outputs:
    type: object
    note: "Map of output-name -> {type, path}. OBJECT form REQUIRED — path points at an effect output (e.g. path: prime.summarize.value). Do NOT use the bare-string shorthand here; that form belongs to a use effect's outputs mapping, not to interface.outputs."
constraints:
  - "interface.outputs entries are objects with path (and usually type) — never bare path strings."
  - "Every interface.outputs path must reference an effect defined in this document."
  - "Declare an interface whenever the orchestration is reusable-shaped — it is what makes composition (use) validated and self-documenting."
example: |
  interface:
    inputs:
      article_text:
        type: string
        required: true
      max_words:
        type: number
        required: false
    outputs:
      summary:
        type: string
        path: prime.summarize.value

  effects:
    - type: prompt
      name: summarize
      template: "Summarize in {{max_words}} words: {{article_text}}"
