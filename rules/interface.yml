section: interface
summary: Optional top-level typed input/output contract for an orchestration. Makes it composable via use with validated inputs and auto-generated output mappings.
placement: "Top-level key, sibling of effects: (interface: then effects:)."
fields:
  inputs:
    type: object
    note: "Map of input-name -> {type, required, description}. OBJECT form per input, e.g. article_text: {type: string, required: true, description: ...}."
  outputs:
    type: object
    note: "Map of output-name -> {path, type?, description?}. Same canonical shape as a use effect's outputs — path points at an effect output in THIS document (e.g. path: prime.summarize.value). The bare string form (summary: prime.summarize.value) is accepted shorthand for {path: ...}; write the object form."
constraints:
  - "interface.outputs and use.outputs take the same shape — object with path (canonical), bare path string (shorthand). There is no interface-only spelling."
  - "Every interface.outputs path must reference an effect defined in this document."
  - "Declare an interface whenever the orchestration is reusable-shaped — it is what makes composition (use) validated and self-documenting."
  - "A declared input <name> is referenced as {{input.<name>}} in templates and state.input.<name> in CEL — never bare. A bare {{<name>}} matching a name declared in this document's own interface.inputs is a hard error from cof check, naming {{input.<name>}} as the fix."
example: |
  interface:
    inputs:
      article_text:
        type: string
        required: true
      max_words:
        type: number
        required: false
    outputs:
      summary:
        type: string
        path: prime.summarize.value

  effects:
    - type: prompt
      name: summarize
      template: "Summarize in {{input.max_words}} words: {{input.article_text}}"
