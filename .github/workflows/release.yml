name: release

# Triggered by pushing a semver tag (``v0.1.0``, ``v1.2.3``).
# Tag the release commit on the main branch:
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# The workflow runs the full test suite, builds the wheel + sdist,
# publishes to PyPI via Trusted Publishing (OIDC — no secrets in this
# repo), and creates a GitHub Release with auto-generated notes.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tools]"
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q -m 'not integration'

  verify-version:
    name: Verify tag matches pyproject version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        name: Compare git tag to pyproject.toml, electricity/Cargo.toml and oscilloscope/Cargo.toml versions
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          # tomllib lives in stdlib for Python 3.11+; the runner has
          # 3.x already so this is portable.
          py_version="$(python3 -c 'import tomllib, sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag"
          echo "pyproject=$py_version"
          if [[ "$tag" != "$py_version" ]]; then
            echo "::error::tag $tag does not match pyproject.toml version $py_version"
            exit 1
          fi
          # Cargo requires valid semver, so a pre-release tag's PEP 440 form
          # (X.Y.ZrcN) maps to Cargo's semver pre-release form (X.Y.Z-rc.N)
          # before comparing (see RELEASING.md's "Pre-releases" section).
          cargo_expected="$tag"
          if [[ "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)$ ]]; then
            cargo_expected="${BASH_REMATCH[1]}-rc.${BASH_REMATCH[2]}"
          fi
          for workspace in electricity oscilloscope; do
            cargo_version="$(grep -m1 '^version = ' "$workspace/Cargo.toml" | sed -E 's/version = "(.*)"/\1/')"
            echo "$workspace=$cargo_version"
            if [[ "$cargo_expected" != "$cargo_version" ]]; then
              echo "::error::tag $tag expects $workspace/Cargo.toml workspace version $cargo_expected, found $cargo_version"
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  electricity-build:
    name: Build electricity (release)
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/rust-release-build.yml
    with:
      workspace-dir: electricity
      binary-crate: electricity-cli
      binary-name: electricity
      build-image: true

  osp-build:
    name: Build osp (release, preview)
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/rust-release-build.yml
    with:
      workspace-dir: oscilloscope
      binary-crate: oscilloscope
      binary-name: osp
      build-image: false

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Inspect artifact
        run: |
          ls -la dist/
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-image:
    name: Publish electricity container image
    runs-on: ubuntu-latest
    # Waits for both builds and for the PyPI upload: the image must not reach
    # ghcr.io before every artifact has built (#359), and the PyPI upload (which
    # can never be repeated for the same version) goes first, so a failed upload
    # leaves no image behind without a release.
    needs: [build, electricity-build, publish-pypi]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download electricity musl archives
        uses: actions/download-artifact@v4
        with:
          pattern: "electricity-*-unknown-linux-musl"
          path: electricity/dist
          merge-multiple: true
      - name: Unpack binaries for the image build context
        working-directory: electricity
        run: |
          version="${{ needs.electricity-build.outputs.version }}"
          mkdir -p dist/linux/amd64 dist/linux/arm64
          tar xzf "dist/electricity-${version}-x86_64-unknown-linux-musl.tar.gz" -C dist/linux/amd64 --strip-components=1
          tar xzf "dist/electricity-${version}-aarch64-unknown-linux-musl.tar.gz" -C dist/linux/arm64 --strip-components=1
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: electricity
          file: electricity/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kenankstipek/electricity:${{ needs.electricity-build.outputs.version }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, electricity-build, osp-build]
    environment:
      name: pypi
      url: https://pypi.org/p/circuitry-cof
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). One-time setup
      # at https://pypi.org/manage/account/publishing/ — point a
      # trusted publisher at this repo + this workflow file.
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No api token argument — relies on OIDC trusted publishing.
          # If trusted publishing is not yet configured on PyPI, this
          # step will fail with a clear "trusted publisher not found"
          # message.
          packages-dir: dist/
          skip-existing: false

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-image, verify-version, electricity-build, osp-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so previous-tag lookup works
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Download electricity archives
        uses: actions/download-artifact@v4
        with:
          pattern: "electricity-*"
          path: electricity-dist/
          merge-multiple: true
      - name: Download osp archives
        uses: actions/download-artifact@v4
        with:
          pattern: "osp-*"
          path: osp-dist/
          merge-multiple: true
      - name: Extract changelog section
        id: changelog
        run: |
          version="${{ needs.verify-version.outputs.version }}"
          # Pull the section between "## [<version>]" and the next "## [".
          notes_file="$(mktemp)"
          if grep -q "^## \[$version\]" CHANGELOG.md; then
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { printing=1; next }
              printing && /^## \[/ { exit }
              printing { print }
            ' CHANGELOG.md > "$notes_file"
          else
            echo "(No CHANGELOG section for v$version yet — see commit history.)" > "$notes_file"
          fi
          {
            echo ""
            echo "---"
            echo ""
            image_version="${{ needs.electricity-build.outputs.version }}"
            echo "electricity's binaries and container image (\`ghcr.io/kenankstipek/electricity:$image_version\`) are attached below as a **preview**: they cannot run orchestrations yet."
            echo "osp's (oscilloscope's) binaries are attached below as a **preview**: it cannot watch or launch orchestrations yet."
          } >> "$notes_file"
          {
            echo "notes_file=$notes_file"
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.verify-version.outputs.version }}"
          # Pre-release tags include 'rc'; mark them so install
          # tooling treats them appropriately.
          prerelease_flag=""
          if [[ "$version" == *"rc"* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "v$version" \
            --title "v$version" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            $prerelease_flag \
            dist/* \
            electricity-dist/* \
            osp-dist/*
