name: release

# Triggered by pushing a semver tag (``v0.1.0``, ``v1.2.3``).
# Tag the release commit on the main branch:
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# The workflow runs the full test matrix and the same lint/typecheck/smoke/
# doc-sync/changelog/direct-reference gate ``quality.yml`` runs, refuses a
# tag whose commit isn't on ``main``, builds the wheel + sdist, publishes to
# PyPI via Trusted Publishing (OIDC — no secrets in this repo), and creates
# a GitHub Release with auto-generated notes.
#
# ``workflow_dispatch`` runs the same pipeline with ``dry_run`` (default
# true) skipping the PyPI upload, the image push and the GitHub Release —
# everything else (tests, the gate, every build) still runs, so the
# pipeline can be exercised on a branch before tagging.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the full pipeline but skip the PyPI upload, the image push and the GitHub Release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tools,toon]"
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q -m 'not integration'

  verify-version:
    name: Verify tag matches pyproject version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need origin/main's history for the ancestor check below
      - name: Refuse a non-dry-run dispatch against an untagged commit
        # A workflow_dispatch's GITHUB_REF is whatever ref it was run
        # against, not necessarily a tag — only a tag push or a dispatch
        # against an existing tag may really publish.
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::dry_run=false requires dispatching against an existing release tag (--ref vX.Y.Z); $GITHUB_REF is not a tag — refusing to publish an untagged commit"
            exit 1
          fi
      - name: Refuse to publish from a commit that is not on main
        # Always enforced for a tag push. A workflow_dispatch dry run may
        # exercise the pipeline from any branch; only a non-dry-run dispatch
        # (dry_run=false), which really publishes, needs the same check.
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF's commit ($GITHUB_SHA) is not on origin/main — refusing to release"
            exit 1
          fi
      - id: extract
        name: Compare git tag to pyproject.toml, electricity/Cargo.toml and oscilloscope/Cargo.toml versions
        run: |
          # workflow_dispatch may run from a branch with no tag at all — in
          # that case (a dry run) there is nothing to compare, so the
          # version comes straight from pyproject.toml.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
          else
            tag=""
          fi
          # tomllib lives in stdlib for Python 3.11+; the runner has
          # 3.x already so this is portable.
          py_version="$(python3 -c 'import tomllib, sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "pyproject=$py_version"
          if [[ -n "$tag" ]]; then
            echo "tag=$tag"
            if [[ "$tag" != "$py_version" ]]; then
              echo "::error::tag $tag does not match pyproject.toml version $py_version"
              exit 1
            fi
          fi
          version="${tag:-$py_version}"
          # Cargo requires valid semver, so a pre-release tag's PEP 440 form
          # (X.Y.ZrcN) maps to Cargo's semver pre-release form (X.Y.Z-rc.N)
          # before comparing (see RELEASING.md's "Pre-releases" section).
          cargo_expected="$version"
          if [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)$ ]]; then
            cargo_expected="${BASH_REMATCH[1]}-rc.${BASH_REMATCH[2]}"
          fi
          for workspace in electricity oscilloscope; do
            cargo_version="$(grep -m1 '^version = ' "$workspace/Cargo.toml" | sed -E 's/version = "(.*)"/\1/')"
            echo "$workspace=$cargo_version"
            if [[ "$cargo_expected" != "$cargo_version" ]]; then
              echo "::error::expected $workspace/Cargo.toml workspace version $cargo_expected, found $cargo_version"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gate:
    name: Full quality gate before publishing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tools]"
          pip install -r requirements-dev.txt
      - name: Run lint
        run: ruff check .
      - name: Run type checks
        run: mypy src
      - name: Smoke-test bundled orchestrations (offline)
        run: bash scripts/smoke-curation.sh
      - name: Check bundled docs are in sync
        run: python scripts/sync-bundled-docs.py --check
      - name: Check changelog fragments
        run: python scripts/build-changelog.py --check
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check built dists for direct-URL dependencies
        run: python scripts/check-direct-references.py dist/*.whl dist/*.tar.gz

  electricity-build:
    name: Build electricity (release)
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/rust-release-build.yml
    with:
      workspace-dir: electricity
      binary-crate: electricity-cli
      binary-name: electricity
      build-image: true

  osi-build:
    name: Build osi (release, preview)
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/rust-release-build.yml
    with:
      workspace-dir: oscilloscope
      binary-crate: oscilloscope
      binary-name: osi
      build-image: false

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Inspect artifact
        run: |
          ls -la dist/
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-image:
    name: Publish electricity container image
    # Dry runs skip this job entirely: its only purpose is the ghcr.io push,
    # and electricity-build already validates the image builds (push: false,
    # unconditionally) via rust-release-build.yml's own build-image job.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    # Waits for both builds and for the PyPI upload: the image must not reach
    # ghcr.io before every artifact has built (#359), and the PyPI upload (which
    # can never be repeated for the same version) goes first, so a failed
    # upload leaves no image behind without a release.
    needs: [build, electricity-build, publish-pypi]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download electricity musl archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "electricity-*-unknown-linux-musl"
          path: electricity/dist
          merge-multiple: true
      - name: Unpack binaries for the image build context
        working-directory: electricity
        run: |
          version="${{ needs.electricity-build.outputs.version }}"
          mkdir -p dist/linux/amd64 dist/linux/arm64
          tar xzf "dist/electricity-${version}-x86_64-unknown-linux-musl.tar.gz" -C dist/linux/amd64 --strip-components=1
          tar xzf "dist/electricity-${version}-aarch64-unknown-linux-musl.tar.gz" -C dist/linux/arm64 --strip-components=1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: electricity
          file: electricity/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kenankstipek/electricity:${{ needs.electricity-build.outputs.version }}

  publish-pypi:
    name: Publish to PyPI
    # Dry runs skip this job entirely: a PyPI upload can never be repeated
    # for the same version, so it must never run outside a real tag release.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    needs: [build, electricity-build, osi-build, gate]
    environment:
      name: pypi
      url: https://pypi.org/p/circuitry-cof
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). One-time setup
      # at https://pypi.org/manage/account/publishing/ — point a
      # trusted publisher at this repo + this workflow file.
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # No api token argument — relies on OIDC trusted publishing.
          # If trusted publishing is not yet configured on PyPI, this
          # step will fail with a clear "trusted publisher not found"
          # message.
          packages-dir: dist/
          skip-existing: false

  github-release:
    name: Create GitHub Release
    # Dry runs skip this job entirely: it only exists to create the release.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-image, verify-version, electricity-build, osi-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so previous-tag lookup works
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Download electricity archives
        uses: actions/download-artifact@v4
        with:
          pattern: "electricity-*"
          path: electricity-dist/
          merge-multiple: true
      - name: Download osi archives
        uses: actions/download-artifact@v4
        with:
          pattern: "osi-*"
          path: osi-dist/
          merge-multiple: true
      - name: Extract changelog section
        id: changelog
        run: |
          version="${{ needs.verify-version.outputs.version }}"
          # Pull the section between "## [<version>]" and the next "## [".
          notes_file="$(mktemp)"
          if grep -q "^## \[$version\]" CHANGELOG.md; then
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { printing=1; next }
              printing && /^## \[/ { exit }
              printing { print }
            ' CHANGELOG.md > "$notes_file"
          else
            echo "(No CHANGELOG section for v$version yet — see commit history.)" > "$notes_file"
          fi
          {
            echo ""
            echo "---"
            echo ""
            image_version="${{ needs.electricity-build.outputs.version }}"
            echo "electricity's binaries and container image (\`ghcr.io/kenankstipek/electricity:$image_version\`) are attached below as a **preview**: it runs many orchestrations and refuses, with a clear message, what it doesn't support yet — see [electricity/README.md](https://github.com/${{ github.repository }}/blob/v$version/electricity/README.md)."
            echo "osi's (oscilloscope's) binaries are attached below as a **preview**: it watches and launches a run on either engine — see [oscilloscope/README.md](https://github.com/${{ github.repository }}/blob/v$version/oscilloscope/README.md)."
          } >> "$notes_file"
          {
            echo "notes_file=$notes_file"
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.verify-version.outputs.version }}"
          # Pre-release tags include 'rc'; mark them so install
          # tooling treats them appropriately.
          prerelease_flag=""
          if [[ "$version" == *"rc"* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            $prerelease_flag \
            dist/* \
            electricity-dist/* \
            osi-dist/*
