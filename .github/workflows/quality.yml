name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run lint
        run: ruff check .

      - name: Run type checks
        run: mypy src
