name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  # Builds the `electricity` binary once, with a Rust cache, and uploads it
  # so every Python matrix job's conformance run downloads the same binary
  # instead of each building its own copy from a cold cache (issue #775).
  build-electricity:
    name: build electricity (shared by the test matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: electricity

      - name: Build electricity binary
        working-directory: electricity
        run: cargo build -p electricity-cli --bin electricity

      - name: Upload electricity binary
        uses: actions/upload-artifact@v4
        with:
          name: electricity-binary
          path: electricity/target/debug/electricity
          if-no-files-found: error
          retention-days: 1

  test:
    needs: build-electricity
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package with the pure-Python optional extras so
          # tool-plugin / runtime-plugin tests for psutil / requests /
          # lxml / etc. can exercise the real libraries instead of
          # skipping. SDK-heavy extras (boto3, playwright, ML models,
          # cloud SDKs) are NOT installed — those tests inject fakes
          # via sys.modules.
          pip install -e ".[tools]"
          pip install -r requirements-dev.txt

      - name: Download electricity binary
        uses: actions/download-artifact@v4
        with:
          name: electricity-binary
          path: electricity-bin

      - name: Make electricity binary executable
        run: chmod +x electricity-bin/electricity

      - name: Run tests
        env:
          ELECTRICITY_BINARY: ${{ github.workspace }}/electricity-bin/electricity
        run: pytest -q -m 'not integration' --cov=circuitry --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tools]"
          pip install -r requirements-dev.txt

      - name: Run lint
        run: ruff check .

      - name: Run type checks
        run: mypy src

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (CLI only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tools]"

      - name: Smoke-test bundled orchestrations (offline)
        run: bash scripts/smoke-curation.sh

  direct-references:
    name: Check built dists for direct-URL dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build a fresh wheel + sdist
        run: uv build -o dist/

      - name: Check for direct-URL dependencies
        run: python scripts/check-direct-references.py dist/*.whl dist/*.tar.gz

  man-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (CLI only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tools]"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            electricity
            oscilloscope

      - name: Check man/man1/*.1 are current
        run: python scripts/generate-man-pages.py --check
