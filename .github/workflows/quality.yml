name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package with the pure-Python optional extras so
          # tool-plugin / runtime-plugin tests for psutil / requests /
          # lxml / etc. can exercise the real libraries instead of
          # skipping. SDK-heavy extras (boto3, playwright, ML models,
          # cloud SDKs) are NOT installed — those tests inject fakes
          # via sys.modules.
          pip install -e ".[tools]"
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q -m 'not integration' --cov=circuitry --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run lint
        run: ruff check .

      - name: Run type checks
        run: mypy src

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (CLI only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Smoke-test bundled orchestrations (offline)
        run: bash scripts/smoke-curation.sh
