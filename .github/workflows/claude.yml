# VENDORED from KenanKStipek/agent-loop@v1 (e43133f) claude-agent.yml +
# templates/claude.yml, inlined because circuitry is PUBLIC and the hub is
# PRIVATE — GitHub forbids public->private reusable-workflow calls, no
# setting overrides it. If the hub ever goes public, replace this file with
# the thin caller (see issue #34). Keep behaviour in sync with the hub by
# diffing against claude-agent.yml when the hub retags v1.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
concurrency:
  group: claude-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) &&
      !contains(github.event.issue.labels.*.name, 'blocked') &&
      !contains(github.event.issue.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Mark issue working
        if: github.event.issue.number && !github.event.issue.pull_request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label working --remove-label ready-for-review

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Checking out a private repo with a PAT is allowed from a public repo
      # (only reusable-workflow CALLS are forbidden). continue-on-error
      # because circuitry's DISPATCH_TOKEN currently lacks agent-loop access
      # — extend the token and this starts working; until then the agent
      # runs without process/AGENT.md, same as before the migration.
      - name: Checkout agent-loop process docs
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: KenanKStipek/agent-loop
          token: ${{ secrets.DISPATCH_TOKEN }}
          path: .agent-loop
          ref: main

      - name: Resolve model
        id: model
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          DEFAULT: claude-sonnet-5
        run: |
          m="$DEFAULT"
          case ",$LABELS," in
            *",model:opus,"*) m="claude-opus-5" ;;
          esac
          case ",$LABELS," in
            *",model:fable,"*) m="claude-fable-5" ;;
          esac
          echo "model=$m" >> "$GITHUB_OUTPUT"
          echo "using model: $m"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Circuitry is Python: this allowlist carries CLAUDE.md's whole
          # verification recipe. It REPLACES defaults at the CLI level
          # (.claude/settings.json allow-rules don't reach agents in CI).
          claude_args: >-
            --max-turns 150
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(pip:*),Bash(pip3:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(bash:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*)"

      - name: Clear working
        if: always() && github.event.issue.number && !github.event.issue.pull_request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label working
