name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
concurrency:
  group: claude-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) &&
      !contains(github.event.issue.labels.*.name, 'blocked') &&
      !contains(github.event.issue.labels.*.name, 'hold')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: KenanKStipek/agent-loop/.github/workflows/claude-agent.yml@v1
    secrets: inherit
    with:
      # Circuitry is Python; the fleet default is TS. This string REPLACES the
      # allowlist entirely (the hub passes it straight to --allowedTools), so it
      # must carry everything CLAUDE.md's verification block needs:
      #   pip install -e ".[tools]" && pip install -r requirements-dev.txt
      #   pytest -q -m 'not integration' && ruff check . && mypy src
      #   bash scripts/smoke-curation.sh
      allowed_tools: Bash(gh:*),Bash(git:*),Bash(pip:*),Bash(pip3:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(bash:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*)
      # model is NOT pinned here. The old inlined workflow hardcoded
      # --model claude-opus-5, which made the model:opus / model:fable labels
      # inert. The hub resolves the model from those labels, defaulting to
      # claude-sonnet-5 — which is the behaviour BMAD.md documents.
