name: Claude Code Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened, edited]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    # Skip drafts and WIP-marked PRs so agent runs don't burn a review per push;
    # the final review fires on the gh pr edit that drops the WIP marker (or
    # ready_for_review for draft PRs). synchronize is intentionally omitted —
    # iteration reviews go through @claude PR comments (claude.yml) instead.
    #
    # CIRCUITRY NOTE: the previous inlined version included `synchronize` and
    # guarded on the loose substring 'WIP'. That is why PR #84 ended up with
    # three overlapping claude-review runs cancelling each other and showing
    # mergeable_state=unstable with every real check green.
    if: |
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.body, '**WIP — run in progress**')
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: KenanKStipek/agent-loop/.github/workflows/claude-review.yml@v1
    secrets: inherit
