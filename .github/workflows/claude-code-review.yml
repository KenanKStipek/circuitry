# VENDORED from KenanKStipek/agent-loop@v1 (e43133f) claude-review.yml +
# templates/claude-code-review.yml (public repo cannot call private hub).
# NO `synchronize` trigger — one review per PR when it leaves draft/WIP;
# iteration reviews go through @claude comments instead. Guard matches the
# EXACT WIP marker; the old loose 'WIP' substring produced overlapping runs
# cancelling each other (how PR #84 got stuck `unstable` with green checks).
name: Claude Code Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened, edited]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    if: |
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.body, '**WIP — run in progress**')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude[bot],claude'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          claude_args: '--model claude-sonnet-5'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
