name: electricity

on:
  pull_request:
    paths:
      - "electricity/**"
      - ".github/workflows/electricity.yml"
      - ".github/workflows/electricity-release-build.yml"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
  push:
    branches:
      - main
      - master
    paths:
      - "electricity/**"
      - ".github/workflows/electricity.yml"
      - ".github/workflows/electricity-release-build.yml"
      - ".github/workflows/release.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  fmt-clippy-test:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: electricity

      - name: cargo fmt --check
        working-directory: electricity
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: electricity
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: electricity
        run: cargo test --workspace

      - name: cargo test --release -p electricity-yaml --test nesting_limit
        working-directory: electricity
        # The `[profile.dev.package.electricity-yaml]` opt-level override
        # (`Cargo.toml`) exists so a *debug* build's larger stack frames
        # still fit `MAX_DEPTH` on a 2 MiB thread; this release run is
        # the other half of that claim -- that a release build holds
        # the same limit on the same stack size *without* the override
        # (which doesn't apply to `--release` at all), so the limit
        # isn't quietly narrower for whichever profile a downstream
        # caller actually ships.
        run: cargo test --release -p electricity-yaml --test nesting_limit

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: msrv
        working-directory: electricity
        run: |
          msrv="$(grep -m1 '^rust-version = ' Cargo.toml | sed -E 's/rust-version = "(.*)"/\1/')"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: cargo check --workspace (MSRV)
        working-directory: electricity
        run: cargo check --workspace

  build:
    name: release build (no publish)
    uses: ./.github/workflows/electricity-release-build.yml
    permissions:
      contents: read
