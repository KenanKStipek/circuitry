name: electricity

on:
  pull_request:
    paths:
      - "electricity/**"
      - ".github/workflows/electricity.yml"
      - ".github/workflows/electricity-release-build.yml"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
  push:
    branches:
      - main
      - master
    paths:
      - "electricity/**"
      - ".github/workflows/electricity.yml"
      - ".github/workflows/electricity-release-build.yml"
      - ".github/workflows/release.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  fmt-clippy-test:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: electricity

      - name: cargo fmt --check
        working-directory: electricity
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: electricity
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: electricity
        run: cargo test --workspace

  generated-files:
    name: generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Generators may import Circuitry itself (and through it PyYAML, chevron,
      # cel-python, jsonschema) so that expected outputs come from the real
      # Python code, never from a re-implementation.
      - name: install Circuitry for the generators
        run: python3 -m pip install -e .

      # Every generator under electricity/scripts/ is named generate_*.py and
      # supports --check (regenerate in memory, fail if the committed file
      # differs). New generators are picked up here without editing this file.
      - name: regenerate every generated file and check it is unchanged
        working-directory: electricity
        run: |
          set -uo pipefail
          failed=0
          for script in scripts/generate_*.py; do
            echo "::group::$script --check"
            if ! python3 "$script" --check; then
              echo "::error::$script: generated output is stale (run it without --check and commit the result)"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: msrv
        working-directory: electricity
        run: |
          msrv="$(grep -m1 '^rust-version = ' Cargo.toml | sed -E 's/rust-version = "(.*)"/\1/')"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: cargo check --workspace (MSRV)
        working-directory: electricity
        run: cargo check --workspace

  build:
    name: release build (no publish)
    uses: ./.github/workflows/electricity-release-build.yml
    permissions:
      contents: read
