name: Dispatch queued agent work
on:
  schedule:
    # Circuitry keeps its 3-hourly cadence rather than the hub template's daily
    # '17 15 * * *'. :17 avoids top-of-hour runner congestion.
    - cron: '17 */3 * * *'
  workflow_dispatch: {} # manual "Run workflow" button
permissions:
  issues: read
jobs:
  dispatch:
    uses: KenanKStipek/agent-loop/.github/workflows/dispatch.yml@v1
    secrets: inherit
    # with:
    #   limit: 1   # hub default is 1; the old inlined version used 2
