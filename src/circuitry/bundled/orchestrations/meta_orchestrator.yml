# Meta-Orchestrator
# ─────────────────────────────────────────────────────────────────────────────
# Uses Circuitry to build Circuitry. Given a natural language description of
# what you want an orchestration to do, this workflow:
#   1. Analyzes your intent into a structured design plan (JSON)
#   2. Plans details in parallel: state flow map + JSON schema decisions
#   3. Generates ONE YAML effect block per step (loop) — each call is focused
#      and low-context; blocks are collected into a single array automatically
#   4. Assembles collected blocks into a complete orchestration YAML
#   5. Self-reviews and corrects common errors (best-effort pass)
#
# Primary output: prime.generate.final_yaml.value
#
# ─── USAGE ───────────────────────────────────────────────────────────────────
#
#   1. Create an input state file:
#        echo '{"user_request": "Build an orchestration that summarizes articles"}' > input.json
#
#   2. Run the orchestration:
#        ./scripts/circuitry run orchestrations/meta_orchestrator.yml \
#          --state input.json --out out.json
#
#   3. Extract the generated YAML:
#        cat out.json | python3 -c "
#          import sys, json
#          print(json.load(sys.stdin)['prime']['generate']['final_yaml']['value'])
#        "
#
# ─── INPUT STATE ─────────────────────────────────────────────────────────────
#
#   Key           Type     Description
#   user_request  string   Natural language description of the orchestration to build
#   rules         string   LLM authoring rules injected from docs/orchestration-reference.md
#
# ─── OUTPUT STATE PATHS ──────────────────────────────────────────────────────
#
#   prime.generate.final_yaml.value
#     → The complete generated orchestration YAML (primary output)
#
#   prime.generate.analyze_intent.value
#     → Structured intent analysis: goal, steps, requires_loop, requires_branching
#
#   prime.generate.plan_details.plan_state_flow.value
#     → Explicit state flow map: what each effect reads and writes
#
#   prime.generate.plan_details.identify_schemas.value
#     → JSON schema planning: which effects need prompt_type:json
#
#   prime.generate.draft_effects.iter_N.draft_effect.value
#     → The YAML effect block produced for step N
#
#   prime.generate.draft_effects.collected.value
#     → Array of all per-step effect blocks (from collect: draft_effect)
#
#   prime.generate.assemble_yaml.value
#     → Complete orchestration YAML assembled from collected blocks
#
# ─── MODEL RECOMMENDATION ────────────────────────────────────────────────────
#
#   A capable model is strongly recommended for reliable YAML generation.
#
#   Ollama:   model: llama3         (default)
#             model: qwen3:8b       → better quality
#             model: qwen3-coder:30b → best quality
#
#   Hosted:   model: claude-haiku-20240307   adapter: anthropic
#             model: gpt-4o-mini             adapter: openai
#
# ─────────────────────────────────────────────────────────────────────────────

effects:
  - type: dynamic
    name: generate
    flow: chain
    effects:
      # ─── Step 1: Analyze user intent ─────────────────────────────────────────
      # Parses the natural language request into a structured design plan.
      # Produces goal, a steps array (2–5 entries), boolean flags for loop and
      # branching requirements, input key descriptions, and the output state path.
      - type: prompt
        name: analyze_intent
        prompt_type: json
        schema:
          type: object
          properties:
            goal:
              type: string
            steps:
              type: array
              items:
                type: string
              minItems: 2
              maxItems: 5
            requires_loop:
              type: boolean
            requires_branching:
              type: boolean
            input_schema:
              type: string
              description: "Plain English description of input keys, e.g. 'article_text: string, max_words: number'"
            output_path:
              type: string
          required:
            - goal
            - steps
            - requires_loop
            - requires_branching
            - input_schema
            - output_path
          additionalProperties: true
        template: |
          CRITICAL: Your response MUST be a single JSON object (starts with `{`, ends with `}`).
          Do NOT return a JSON array (starts with `[`). Do NOT return just the steps list.

          You are a Circuitry orchestration designer. Analyze the user request and fill in ALL 6 fields of this JSON object:

          User request: "{{user_request}}"

          Available effect types: prompt (model call), dynamic (container), loop (iterate), if (branch)

          Your complete response — fill in every field:
          {
            "goal": "<one sentence: what this orchestration does>",
            "steps": ["step1: prompt - <action>", "step2: loop - <action>", "step3: prompt - <action>"],
            "requires_loop": <true or false>,
            "requires_branching": <true or false>,
            "input_schema": "<plain English e.g. article_text: string, max_words: number>",
            "output_path": "prime.<final_effect_name>.value"
          }

          Rules for each field:
          - goal: one sentence string
          - steps: 2–5 strings, each "<step_N>: <effect_type> - <what it does>"
          - requires_loop: boolean (true/false)
          - requires_branching: boolean (true/false)
          - input_schema: plain English string — NOT a JSON schema object, NOT an array
          - output_path: string like "prime.summarize.value"

          Return ONLY the JSON object above with all 6 fields filled in. No explanation. No markdown.

      # ─── Step 2: Plan details in parallel (tree) ─────────────────────────────
      # Two planning prompts run simultaneously — each sees the analyze_intent
      # output but not each other's results. Together they give each per-step
      # draft_effect call all the context it needs:
      #   a. plan_state_flow  → explicit input→output state path map
      #   b. identify_schemas → which effects need prompt_type:json + draft schemas
      - type: dynamic
        name: plan_details
        flow: tree
        effects:
          # ─ a. State flow: explicit data dependency map ────────────────────────
          - type: prompt
            name: plan_state_flow
            template: |
              You are mapping the data flow for a Circuitry orchestration.

              User request: "{{user_request}}"
              Goal: {{prime.generate.analyze_intent.value.goal}}
              Planned steps: {{prime.generate.analyze_intent.value.steps}}
              Input keys the user provides: {{prime.generate.analyze_intent.value.input_schema}}
              Expected primary output: {{prime.generate.analyze_intent.value.output_path}}

              Circuitry state path conventions:
                Top-level effect output:          prime.<effect_name>.value
                Inside a named dynamic container: prime.<dynamic_name>.<effect_name>.value
                Loop body effect output:          prime.<loop_name>.iter_N.<body_name>.value
                User-provided state key:          accessed directly as {{key_name}} (no prime. prefix)

              Produce a precise data flow map:
              1. For each planned step, list:
                 - The state path it WRITES (its output location)
                 - The state paths and input keys it READS (its data dependencies)
              2. Flag effects that read loop-iteration variables (e.g., {{item}} or a named loop variable)
              3. Confirm no effect reads from an output written AFTER it in chain order
              4. Identify the final output path — this is the primary result returned to the user

              Be precise about path syntax. This map will guide state path references in each effect block.

          # ─ b. Schema plan: identify JSON-typed effects and draft their schemas ─
          - type: prompt
            name: identify_schemas
            template: |
              You are planning the structured JSON outputs for a Circuitry orchestration.

              User request: "{{user_request}}"
              Goal: {{prime.generate.analyze_intent.value.goal}}
              Planned steps: {{prime.generate.analyze_intent.value.steps}}

              In Circuitry, a prompt effect can request structured JSON output by setting:
                prompt_type: json
                schema:
                  type: object
                  properties: { ... }
                  required: [...]

              Review every planned step and specify:
              1. Should this effect use prompt_type: json?
                 Use json for: extracting structured data, producing lists for downstream loops,
                 decisions requiring reliable boolean/number output, any output read via .value.<field>.
              2. If yes: draft a minimal JSON schema (type: object, properties, required array).
              3. If no (plain text): briefly note why plain text is appropriate here.

              Format as a numbered list, one entry per planned step. This will be used when each
              effect block is drafted to set the correct prompt_type and schema.

      # ─── Step 3: Generate one effect block per step (loop + collect) ──────────
      # Iterates over the planned steps array. Each iteration produces EXACTLY
      # ONE YAML effect block — a single focused LLM call with minimal context.
      # flow: tree runs all iterations in parallel (order preserved in collected).
      # The collect field aggregates all blocks into:
      #   prime.generate.draft_effects.collected.value → [block_0, block_1, ...]
      - type: loop
        name: draft_effects
        flow: tree
        collect: draft_effect
        each:
          in: prime.generate.analyze_intent.value.steps
          as: step
        body:
          - type: prompt
            name: draft_effect
            template: |
              You are writing a single Circuitry YAML effect block. Write ONLY this one block.

              Step to implement: "{{step}}"
              Overall goal: {{prime.generate.analyze_intent.value.goal}}
              All planned steps (for context on ordering and naming):
              {{prime.generate.analyze_intent.value.steps}}

              State flow map (what each step reads and writes — use this for correct state path references):
              {{prime.generate.plan_details.plan_state_flow.value}}

              JSON schema plan (use this to set prompt_type and schema for this step if needed):
              {{prime.generate.plan_details.identify_schemas.value}}

              {{rules}}

              Write one complete YAML effect block for this step using the rules above.
              Include a rich, specific prompt template — be precise about role, context, task, and output format.

              Return ONLY the YAML block for this one step.
              No markdown fences. No full orchestration file. No explanation. No preamble.

      # ─── Step 4: Assemble collected blocks into a complete YAML file ──────────
      # Low-context mechanical step: receives the collected array of effect blocks
      # and wraps them in the standard orchestration file header.
      # The heavy lifting (writing effect content) was done in Step 3.
      - type: prompt
        name: assemble_yaml
        template: |
          You are assembling a complete Circuitry orchestration YAML file from pre-written effect blocks.

          User request: "{{user_request}}"
          Goal: {{prime.generate.analyze_intent.value.goal}}
          Input keys: {{prime.generate.analyze_intent.value.input_schema}}
          Primary output path: {{prime.generate.analyze_intent.value.output_path}}

          The following effect blocks were each generated individually and are ready to use:
          <<< BEGIN EFFECT BLOCKS >>>
          {{prime.generate.draft_effects.collected.value}}
          <<< END EFFECT BLOCKS >>>

          Your task: assemble these blocks into a single valid orchestration YAML file.
          1. Add a header comment block describing what the orchestration does, its input keys,
             and the primary output path.
          2. Add:        effects:
          3. Indent each effect block under effects: with 2-space indentation.
          4. Preserve every effect block exactly as provided — do not rewrite or modify any content.
          5. Add short section comments above each effect where helpful.
          Do NOT include adapter: or model: keys — those come from user config.

          Return ONLY the assembled YAML. No markdown fences. No explanation outside YAML comments.

      # ─── Step 5: Self-review and produce final output ────────────────────────
      # Best-effort structural review — catches common Circuitry errors before
      # returning the final output. Uses a compact checklist rather than the
      # full rules to stay within model context limits.
      # PRIMARY OUTPUT: prime.generate.final_yaml.value
      - type: prompt
        name: final_yaml
        template: |
          You are doing a structural review of a Circuitry orchestration YAML. Silently fix any issues found, then output the complete corrected YAML.

          Original user request: "{{user_request}}"

          Draft YAML to review:
          <<< BEGIN DRAFT YAML >>>
          {{prime.generate.assemble_yaml.value}}
          <<< END DRAFT YAML >>>

          Checklist — silently fix any violations:
          1. Every effect has a valid type: prompt | dynamic | loop | if | reflector
          2. Every effect has a name (snake_case, no spaces, no dots)
          3. Every prompt effect has a template or messages field
          4. State paths use the correct prefix: prime.<effect_name>.value for top-level,
             prime.<dynamic_name>.<effect_name>.value for effects inside a named dynamic,
             prime.<loop_name>.iter_N.<body_name>.value for loop body effects
          5. User-provided input keys (from the request) are referenced as {{key_name}} directly (no prime. prefix)
          6. Loop each.in points to an existing state path; body effects are a list
          7. Dynamic effects have a non-empty effects: list
          8. No duplicate sibling effect names within the same container

          Do NOT rewrite or replace the orchestration — only fix what violates the checklist above.
          Return ONLY the final YAML. No markdown fences. No explanations. No preamble. Start with `effects:`.
