type: loop
summary: Iterates over a collection (each) or repeats while a condition holds (while).
required: [type, body]
one_of: [each, while]
fields:
  name:
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    note: "Optional. Required if using collect."
  body:
    type: array
    min_items: 1
    note: "Effects to execute each iteration."
  each:
    type: object
    properties:
      in: "Dot-delimited state path to a JSON array, rooted at input., prime., or runtime. (e.g. input.items, prime.my_list.value)."
      as: "Variable name for current element (default: item). Accessible as {{as_name}}."
      truncate:
        type: boolean
        default: false
        note: "Default false: a collection longer than max_iterations fails the loop at start (each.in's length is known before the first pass, so hitting the cap is never a runaway — see max_iterations). true opts into the old behavior: process only the first max_iterations elements and record termination: max_iterations_reached plus the unvisited count instead of erroring."
    required: [in]
    note: "each.in must be root-relative — input./prime./runtime.-rooted. A bare key or a state.-prefixed spelling (state. is a CEL-only binding, not legal here) is a hard error from cof check, naming the canonical spelling. input.<name> is a first-class source: each.in does not have to point at a prompt_type: json effect."
  while:
    type: object
    properties:
      mode: "model or cel"
      template: "Prompt template (when mode: model)"
      expr: "CEL expression (when mode: cel). Use state.prime.<name>.value prefix."
      strict: "mode: cel only. Default false: an unset state. path makes the condition false and logs a WARNING. true: an unresolved path raises instead."
    note: "Loop repeats while condition is true. while-loops always run sequentially."
  collect:
    type: string
    note: "Name of a body effect whose .value is aggregated across iterations into an array at prime.<loop_name>.collected.value. Requires a named loop."
  flow:
    type: string
    enum: [chain, tree]
    default: chain
    note: "tree runs all each-iterations in parallel (order preserved). while-loops ignore this."
  max_concurrency:
    type: integer
    min: 1
    note: "Max parallel workers when flow is tree."
  max_iterations:
    type: integer
    default: 100
    note: "Hard cap on iterations. For while-loops this is the deliberate safety floor against runaway feedback — hitting it ends the loop and records termination: max_iterations_reached. For each-loops the collection length is known up front, so when this is set, the collection must not be longer than it; otherwise the loop fails at start (see each.truncate to opt out of that check)."
  min_iterations:
    type: integer
    min: 0
    note: "Minimum iterations to run before the while condition is checked. Only meaningful for while-loops."
  on_error:
    enum: [fail, break, continue]
    default: fail
    note: "break exits the loop. continue skips the iteration."
state_paths:
  within_iteration: "prime.<body_name>.value — a body step reading another body step in the SAME pass. Legal inside the body and inside the while condition; resolves against the current iteration first, then the enclosing scope, then root state. Works in named and unnamed loops, chain and tree flow. The bare {{<body_name>.value}} form means the same node but can collide with a user-supplied state key, so prefer the prime. prefix."
  iteration_output: "prime.<loop_name>.iter_N.<body_name>.value — ONE specific pass. Use it only AFTER the loop: N is a constant, so inside the body every pass reads pass N's output (stale data, not an error)."
  last_iteration: "prime.<loop_name>.last.<body_name>.value — the FINAL completed pass, after the loop. Same shape as iter_N (deep field paths work); a pass that errored under on_error: continue/break is skipped in favor of the last one that finished, and a zero-iteration loop writes no last key. Use this instead of guessing N for while loops and data-dependent each loops."
  collected_array: "prime.<loop_name>.collected.value — every pass's value, after the loop. Requires collect."
  loop_variable: "{{as_name}}"
  termination_reason: "prime.<loop_name>.value.termination.reason — always present on a completed (named) loop node. One of: condition_false (while), collection_exhausted (each), max_iterations_reached (while's cap, or each.truncate: true's cap), collection_unresolved (each.in didn't resolve to an array), condition_error (while condition raised under on_error: break/continue), error (the loop raised — see termination.detail and meta.error). max_iterations_reached under each.truncate: true also carries termination.unvisited (count of elements never visited)."
constraints:
  - "Exactly one of each or while is required, never both."
  - "each.in must be a JSON array at a root-relative path (input.<name>, prime.<effect_name>.value, or a runtime. path). input.* is a first-class source — the array does not have to come from a prompt_type: json effect."
  - "collect requires the loop to have a name."
  - "Within-iteration, cross-iteration, last-pass and post-loop references are four different things: prime.<body_name>.value, prime.<loop_name>.iter_N.<body_name>.value, prime.<loop_name>.last.<body_name>.value, prime.<loop_name>.collected.value. Do not substitute one for another."
  - "last is legal AFTER the loop only, like iter_N. Inside the loop's own body (or while condition) it resolves to the previous pass at best — validation warns; write prime.<body_name>.value for the current pass."
  - "prime.<loop_name>.<body_name>.value never resolves — prime.<loop_name> holds iter_N, last, collected and meta, never body step names. Write prime.<body_name>.value instead."
  - "A body step shadows an enclosing effect of the same name, for the length of the body only."
example: |
  - type: loop
    name: summarize_articles
    flow: tree
    collect: article_summary
    each:
      in: prime.extract_articles.value
      as: article
    body:
      - type: prompt
        name: article_notes
        template: |
          List the key claims in this article, one per line:
          {{article}}
      # Within-iteration reference: article_notes ran a moment ago in THIS
      # pass. Not prime.summarize_articles.iter_0.article_notes.value, which
      # would pin every pass to the first article's notes.
      - type: prompt
        name: article_summary
        template: |
          Summarize this article in 2-3 sentences, using these notes:
          {{prime.article_notes.value}}
