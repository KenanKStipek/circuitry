type: tool
summary: Executes a non-LLM side-effect via a named plugin. For image generation, video/audio processing, file conversion ONLY.
required: [type, name, provider]
fields:
  name:
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  provider:
    type: string
    note: "Plugin name. Supported: ffmpeg, comfyui. Must match an installed plugin."
  prompt:
    type: string
    note: "Primary prompt/input for the plugin. Supports Mustache rendering. For comfyui: the image generation prompt."
  model:
    type: string
    note: "Model/checkpoint for the plugin. For comfyui: checkpoint filename (e.g. flux1-dev-fp8.safetensors)."
  params:
    type: object
    note: "Plugin-specific parameters. All string values support Mustache rendering. A leaf anywhere in params (any depth, in objects and lists), {from: <path>}, passes the value at that path unchanged (array, object, number or boolean) instead of rendering it, same contract as a use effect's inputs; add default: <value> alongside from: to fall back when the path doesn't resolve. A mapping with any other key is a literal value, passed as written — use params_json to pass a literal one-key {from: ...} object."
  params_json:
    type: string
    note: "A Mustache template rendered to text and parsed as JSON, deep-merged over params (params_json wins on conflicts). Use it to send a runtime-built array/object (e.g. a list from a prior step) instead of a Mustache-rendered string — e.g. '{\"arguments\": {\"symbols\": {{{prime.symbol_list.value}}} }}'. A bad template or non-JSON result is a hard failure."
  timeout_ms:
    type: integer
  retries:
    type: object
    properties:
      max_attempts: "integer, min 1"
      backoff_ms: "integer, min 0"
    note: "Retry policy, same shape and backoff curve as a prompt's. Usually omitted. HTTP-family providers (http, web_fetch, webhook, linear) retry 429/408/5xx only; every other (process) provider retries on any failure."
  expect:
    note: "Output check, run after a successful attempt; a false or unreadable expectation fails it (retries/on_error apply). Either a bare CEL string (sugar for {mode: cel, expr: <string>}) over this effect's own value and meta plus state — e.g. expect: \"has(value.prompt_id)\" — or {mode: model, template: ...}, asked yes/no on the run's adapter/model. Usually omitted."
  on_error:
    enum: [fail, skip, continue]
    default: fail
  cache:
    type: "boolean or object"
    properties:
      ttl: "string ('7d', '12h', '30m', '45s') or number of seconds"
      key: "string, extra salt"
    note: "Opt-in result cache: true, or {ttl, key}. Keyed by the provider and the fully rendered params (after {from: ...} resolution). A hit skips dispatch entirely — including a tool's own side effect, e.g. a file it would write is not recreated. Only a result that passed expect: (or had none) is ever stored. cof check rejects cache: on anything but a prompt/tool effect. Usually omitted."
  group:
    type: string
    note: "Named concurrency-group slot (runtime.concurrency_groups.<name>) this effect waits for a free slot in before dispatching, on top of runtime.max_concurrency's run-wide cap. Must name a group runtime.concurrency_groups defines, or cof check rejects it. Usually omitted."
state_paths:
  output: "prime.<name>.value"
  template_ref: "{{prime.<name>.value}}"
constraints:
  - "NEVER use tool effects for text tasks (summarization, analysis, writing, coding, data extraction). Those are prompt effects."
  - "Tool effects are ONLY for non-LLM side-effects: generating images, processing video/audio, file conversion."
  - "Always use a prompt effect before a tool to generate the tool's parameters via state interpolation."
  - "Available plugin descriptions are injected separately via {{plugins}}."
  - "Quote every params.args entry. Unquoted, YAML reads 0x1 as 1, off as false and -0 as 0, and the tool receives that instead of what you wrote; cof check warns."
  - "params.allowed_commands (shell plugin) must stay a literal list of strings written in the document — never {from: ...} and never a templated entry. It is the plugin's security allowlist; a runtime or model-supplied value there is rejected."
providers:
  ffmpeg:
    required_params: [input, output]
    note: "input and output are file paths. Shell metacharacters are rejected."
  comfyui:
    required_fields: [prompt, model]
    note: "prompt is the image generation text. model is the checkpoint filename."
example: |
  - type: tool
    name: generate_image
    provider: comfyui
    prompt: "{{prime.expand_prompt.value}}"
    model: flux1-dev-fp8.safetensors
    params:
      width: 768
      height: 768
      steps: 20
      image_dir: "./output/images"
