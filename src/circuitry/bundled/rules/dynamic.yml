type: dynamic
summary: Named container that groups child effects. Executes as chain (sequential) or tree (parallel).
required: [type, name, effects]
fields:
  name:
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  effects:
    type: array
    min_items: 1
    note: "Child effects to execute. Must be non-empty."
  flow:
    type: string
    enum: [chain, tree]
    default: chain
    note: "chain = sequential (each child sees prior outputs). tree = parallel (all children see same input snapshot)."
    also_accepted: "chain_of_thought and cot parse as chain; tree_of_thought and tot parse as tree. Deprecated — write chain or tree."
  max_concurrency:
    type: integer
    min: 1
    note: "Maximum parallel workers for tree flow. Unset (default): every child runs at once. No meaning on chain flow, which always runs one child at a time."
  stop_on_error:
    type: boolean
    note: "Tree flow only. true cancels every child that has not started yet as soon as one fails; an already-running child cannot be cancelled. No effect on chain flow, where a failing child already stops the ones after it. Usually omitted — prefer on_error, which covers the same intent per effect."
  on_error:
    enum: [fail, skip, continue]
    default: fail
    note: "Same meaning as on a leaf effect: governs whether a failure anywhere inside this dynamic propagates to this dynamic's own parent (fail) or is recorded on this dynamic's own meta.error and swallowed there, letting the parent continue (skip/continue — the same degradation for both)."
  labels:
    type: object
    note: "Free-form metadata, recorded on meta.labels. Observability tagging, not behavior."
state_paths:
  child_output: "prime.<dynamic_name>.<child_name>.value"
  template_ref: "{{prime.<dynamic_name>.<child_name>.value}}"
  cel_ref: "state.prime.<dynamic_name>.<child_name>.value"
constraints:
  - "effects array must contain at least one effect."
  - "Do not prescribe a fixed number of children — let the problem dictate the decomposition."
example: |
  - type: dynamic
    name: plan_details
    flow: tree
    effects:
      - type: prompt
        name: plan_state_flow
        template: |
          Map the data flow for each step...
      - type: prompt
        name: plan_schemas
        template: |
          Identify which steps need prompt_type: json...
