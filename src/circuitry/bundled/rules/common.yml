section: common
summary: Rules that apply to all effect types.

file_structure:
  top_level_fields:
    - effects (array, required)
    - adapter (string, optional — inherited from config)
    - model (string, optional — inherited from config)
    - flow (string, optional — default chain)
    - interface (object, optional — typed I/O contract; see the interface section)
    - version (number, optional — schema/compatibility version; usually omitted)
  notes:
    - "adapter and model are only needed when the orchestration contains prompt or reflector effects."
    - "Tool-only orchestrations do not need adapter or model."
    - "Declare interface when the orchestration is meant to be composed by a use effect."
  valid_adapters: [ollama, openai, anthropic, litellm]
  valid_flows:
    sequential: [chain, chain_of_thought, cot]
    parallel: [tree, tree_of_thought, tot]

effect_fields:
  summary: "Fields accepted by every effect type, in addition to the type-specific fields."
  description:
    type: string
    note: "Free-text note about what the effect does. Optional, never interpolated — documentation only."
  labels:
    type: object
    note: "Free-form key/value metadata carried through to traces (dynamic, if/conditional, and loop effects). Usually omitted — observability tagging, not behaviour."
  on_error:
    note: "fail (default) / skip / continue on every effect except loop, which uses fail / break / continue."

naming:
  pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  rules:
    - "snake_case: letters, digits, underscores only."
    - "Must start with a letter or underscore."
    - "iter_N (e.g. iter_0) is reserved — never use it as a name."
    - "Names must be unique among siblings in the same scope."
    - "Never name an effect after its type (use, loop, if, dynamic, prompt, tool). Duplicate generic names collide across scopes and make state paths ambiguous — name the effect for what it does."
    - "Prefer singular names (summarize_article, draft_section). A plural name (summarize_articles, extract_points) is a smell — the effect likely does multiple things and should be split into a loop or tree dynamic with a singular-named body effect."

state_paths:
  in_templates:
    input_key: "{{key_name}}"
    top_level_output: "{{prime.<effect_name>.value}}"
    inside_dynamic: "{{prime.<dynamic_name>.<child_name>.value}}"
    loop_iteration: "{{prime.<loop_name>.iter_N.<body_name>.value}}"
    loop_collected: "{{prime.<loop_name>.collected.value}}"
  in_cel_expressions:
    prefix: "state."
    example: "state.prime.<effect_name>.value"
    note: "Always include the state. prefix in CEL. Never omit it."

yaml_style:
  - "Quote any scalar containing a colon-space, a leading {{, or a leading special character — an unquoted \"Summarize: {{text}}\" is a YAML parse error, not a string."
  - "Use a block scalar (|) for multi-line templates rather than quoting each line."
  - "Emit plain YAML only — no markdown fences, no commentary around the document."
