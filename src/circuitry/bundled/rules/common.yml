section: common
summary: Rules that apply to all effect types.

file_structure:
  top_level_fields:
    - effects (array, required)
    - adapter (string, optional — inherited from config)
    - model (string, optional — inherited from config)
    - flow (string, optional — default chain)
    - version (string, optional — free-form; see below)
    - interface (object, optional — declared inputs/outputs)
  notes:
    - "adapter and model are only needed when the orchestration contains prompt or reflector effects."
    - "Tool-only orchestrations do not need adapter or model."
    - "version is a free-form version string for this document (e.g. '1.2.0'), for the author's own tracking. It is NOT a schema version and NOT a feature gate — the runtime reads it and ignores it. Omit it unless you are actually versioning the file."
  valid_adapters: [ollama, openai, anthropic, litellm]
  valid_flows:
    sequential: chain
    parallel: tree
    also_accepted: "chain_of_thought and cot parse as chain; tree_of_thought and tot parse as tree. Deprecated — always write chain or tree."

naming:
  pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  rules:
    - "snake_case: letters, digits, underscores only."
    - "Must start with a letter or underscore."
    - "iter_N (e.g. iter_0) is reserved — never use it as a name."
    - "Names must be unique among siblings in the same scope."
    - "Never name an effect after an effect type (use, loop, if, dynamic, prompt, tool, reflector). Name it after the job it does — summarize_article, not prompt. Type-keyword names are generic, so two of them end up siblings and collide. `cof validate` warns on them."
    - "Prefer singular names (summarize_article, draft_section). A plural name (summarize_articles, extract_points) is a smell — the effect likely does multiple things and should be split into a loop or tree dynamic with a singular-named body effect."

outputs:
  summary: "Both use.outputs and interface.outputs declare the same thing — expose this state path under this name — in the same canonical shape."
  canonical: |
    outputs:
      summary: {path: prime.summarize.value, type: string}
  fields:
    path: "REQUIRED. Dot-delimited state path in the producing orchestration."
    type: "Optional. string | number | boolean | array | object."
    description: "Optional."
  also_accepted: "The bare string form (summary: prime.summarize.value) is sugar for {path: ...} and works in both contexts. Write the object form."

state_paths:
  in_templates:
    input_key: "{{key_name}}"
    top_level_output: "{{prime.<effect_name>.value}}"
    inside_dynamic: "{{prime.<dynamic_name>.<child_name>.value}}"
    loop_iteration: "{{prime.<loop_name>.iter_N.<body_name>.value}}"
    loop_collected: "{{prime.<loop_name>.collected.value}}"
  in_cel_expressions:
    prefix: "state."
    example: "state.prime.<effect_name>.value"
    note: "Always include the state. prefix in CEL. Never omit it."
