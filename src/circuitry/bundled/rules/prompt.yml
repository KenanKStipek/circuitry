type: prompt
summary: Atomic LLM call. Produces a typed value at prime.<name>.value.
required: [type, name]
one_of: [template, messages]
fields:
  name:
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    note: "snake_case, unique among siblings. iter_N is reserved."
  template:
    type: string
    note: "Mustache template. {{input.<name>}} for caller-supplied input, {{prime.<name>.value}} for effect outputs."
    conflicts_with: messages
  messages:
    type: array
    items: "{role: system|user|assistant|tool, content: string}"
    note: "Role-based message array, sent as real conversation turns (system message included) where the adapter takes them. Mutually exclusive with template."
    conflicts_with: template
  prompt_type:
    type: string
    enum: [text, json, boolean, number, array, object]
    default: text
    note: "Use json when output feeds downstream effects via .value.<field>."
  schema:
    type: object
    required_when: "prompt_type is json"
    note: "Keep to 3-4 properties max. If more complex, split into multiple smaller prompts."
  model:
    type: string
    note: "Per-effect model override. Usually omitted (inherited from config)."
  provider:
    type: string
    note: "Per-effect provider override. Usually omitted (inherited from config)."
  provider_fallbacks:
    type: array
    items: string
    note: "Ordered list of fallback providers tried when the primary fails. Usually omitted — runner/config policy, not author-facing."
  params:
    type: object
    note: "Generation parameters. temperature, max_tokens and stop work on every adapter; other keys (top_p, num_ctx, ...) go to the provider as written."
  deterministic:
    type: boolean
    note: "If true, temperature 0 (unless params sets one) and a fixed seed where the provider takes one."
  inputs:
    type: object
    note: "Prompt-local key/value pairs available to this template only. Prefer referencing shared state via {{prime.<name>.value}}; use inputs for constants scoped to this one call."
  assets:
    type: array
    items: "{kind: image|file|audio, ref: string}"
    note: "Images for a vision model: kind image, ref a local path or http(s) URL (Mustache-rendered; use {{{...}}} so a URL's & is not HTML-escaped). Sent by ollama, the OpenAI-compatible adapters and anthropic; other kinds are skipped with a warning."
  retries:
    type: object
    properties:
      max_attempts: "integer, min 1"
      backoff_ms: "integer, min 0"
    note: "Retry policy for this call. Usually omitted — runner/config policy, not author-facing."
  timeout_ms:
    type: integer
    note: "Per-attempt budget, capped by the adapter's timeout_seconds; rounded up to whole seconds."
  on_error:
    enum: [fail, skip, continue]
    default: fail
  cache:
    type: "boolean or object"
    properties:
      ttl: "string ('7d', '12h', '30m', '45s') or number of seconds"
      key: "string, extra salt"
    note: "Opt-in result cache: true, or {ttl, key}. Keyed by the rendered prompt/messages, model/provider, and generation params. A hit skips dispatch entirely (no tokens); only a successfully decoded/validated reply is ever stored. cof check rejects cache: on anything but a prompt/tool effect. Usually omitted."
  group:
    type: string
    note: "Named concurrency-group slot (runtime.concurrency_groups.<name>) this call waits for a free slot in before dispatching, on top of runtime.max_concurrency's run-wide cap. Must name a group runtime.concurrency_groups defines, or cof check rejects it. Usually omitted."
state_paths:
  output: "prime.<name>.value"
  in_dynamic: "prime.<dynamic_name>.<name>.value"
  template_ref: "{{prime.<name>.value}}"
  cel_ref: "state.prime.<name>.value"
constraints:
  - "Never use prompt_type: image — use type: tool, provider: comfyui instead."
  - "A complex schema (>3-4 properties) is a smell. Split into multiple prompts with simpler schemas."
  - "Exactly one of template or messages is required, never both."
example: |
  - type: prompt
    name: classify_input
    prompt_type: json
    schema:
      type: object
      properties:
        category: {type: string}
        confidence: {type: number}
      required: [category, confidence]
    template: |
      Classify this text into a category.
      Text: "{{input.user_input}}"
      Return ONLY a JSON object with "category" and "confidence".
