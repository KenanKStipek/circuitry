effects:
  - type: prompt
    name: goal
    template: "Give me a one-sentence goal for a small demo app."

  # reflector — planning primitive that generates and executes effects at runtime.
  # The built-in prime directive already carries the goal above (prime.goal.value,
  # read from the run's root state) and a redacted summary of the run's effective
  # settings (model, adapter, plugins) — propose_steps does not need to reference
  # them itself; its own template renders against the reflector's isolated node,
  # where prime.goal.value is not visible.
  - type: reflector
    name: plan
    max_effects: 5
    effects:
      - type: prompt
        name: propose_steps
        template: |
          Output must follow the OUTPUT CONTRACT exactly.
          Now generate effects.
