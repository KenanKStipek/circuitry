# Hello World — the simplest Circuitry orchestration.
#
# Usage:
#   cof run orchestrations/hello.yml -e name=World
#   cof run orchestrations/hello.yml -e name=World --tail
#
# State path: prime.greet.value

interface:
  inputs:
    name:
      type: string
      required: true
      description: Who to greet.

effects:
  - type: prompt
    name: greet
    template: "Say hello to {{input.name}} in a creative way."
