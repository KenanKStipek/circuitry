name: _image
description: Smoke test for image generation via ComfyUI

adapter: comfyui
model: flux1-dev-fp8.safetensors

effects:
  - name: generate_image
    type: prompt
    prompt_type: image
    prompt: "a red apple on a wooden table, photorealistic"
    image_output: path
    image_dir: ./output/images
    params:
      steps: 20
      cfg: 3.5
      sampler_name: euler
      scheduler: beta
      width: 512
      height: 512
