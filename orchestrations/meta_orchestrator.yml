# Meta-Orchestrator
# ─────────────────────────────────────────────────────────────────────────────
# Uses Circuitry to build Circuitry. Given a natural language description of
# what you want an orchestration to do, this workflow:
#   1. Analyzes your intent into a structured design plan (JSON)
#   2. Elaborates each planned step into a YAML effect stub (loop)
#   3. Drafts a complete Circuitry YAML orchestration
#   4. Self-reviews and corrects common errors (best-effort pass)
#
# Primary output: prime.generate.final_yaml.value
#
# ─── USAGE ───────────────────────────────────────────────────────────────────
#
#   1. Create an input state file:
#        echo '{"user_request": "Build an orchestration that summarizes articles"}' > input.json
#
#   2. Run the orchestration:
#        ./scripts/circuitry run orchestrations/meta_orchestrator.yml \
#          --state input.json --out out.json
#
#   3. Extract the generated YAML:
#        cat out.json | python3 -c "
#          import sys, json
#          print(json.load(sys.stdin)['prime']['generate']['final_yaml']['value'])
#        "
#
# ─── INPUT STATE ─────────────────────────────────────────────────────────────
#
#   Key           Type     Description
#   user_request  string   Natural language description of the orchestration to build
#
# ─── OUTPUT STATE PATHS ──────────────────────────────────────────────────────
#
#   prime.generate.final_yaml.value
#     → The complete generated orchestration YAML (primary output)
#
#   prime.generate.analyze_intent.value
#     → Structured intent analysis: goal, steps, requires_loop, requires_branching
#
#   prime.generate.elaborate_steps.iter_N.yaml_stub.value
#     → Per-step YAML effect block stubs (one per planned step)
#
#   prime.generate.draft_yaml.value
#     → Initial YAML draft (before self-review pass)
#
# ─── MODEL RECOMMENDATION ────────────────────────────────────────────────────
#
#   A capable model is strongly recommended for reliable YAML generation.
#
#   Ollama:   model: llama3         (default)
#             model: qwen3:8b       → better quality
#             model: qwen3-coder:30b → best quality
#
#   Hosted:   model: claude-haiku-20240307   adapter: anthropic
#             model: gpt-4o-mini             adapter: openai
#
# ─────────────────────────────────────────────────────────────────────────────

adapter: ollama
model: llama3

effects:
  - type: dynamic
    name: generate
    flow: chain
    effects:

      # ─── Step 1: Analyze user intent ─────────────────────────────────────────
      # Parses the natural language request into a structured design plan.
      # Produces goal, a steps array (2–5 entries), boolean flags for loop and
      # branching requirements, input key descriptions, and the output state path.
      - type: prompt
        name: analyze_intent
        prompt_type: json
        schema:
          type: object
          properties:
            goal:
              type: string
            steps:
              type: array
              items:
                type: string
              minItems: 2
              maxItems: 5
            requires_loop:
              type: boolean
            requires_branching:
              type: boolean
            input_schema:
              type: string
            output_path:
              type: string
          required:
            - goal
            - steps
            - requires_loop
            - requires_branching
            - input_schema
            - output_path
          additionalProperties: false
        template: |
          You are a Circuitry orchestration designer. Analyze the user request below and return a structured JSON design plan.

          User request: "{{user_request}}"

          Circuitry orchestration primitives available:
          - prompt: single model invocation (supports prompt_type: text, json, boolean, number)
          - dynamic: named container with flow: chain (sequential) or tree (parallel)
          - loop: iterate over a JSON array using each.in (state path) and each.as (loop variable)
          - if: branch on a CEL expression (mode: cel) that references state paths like state.prime.X.value

          Return exactly this JSON structure:
          {
            "goal": "one sentence describing what this orchestration does",
            "steps": ["step1: prompt - do X", "step2: loop - iterate over Y", "step3: prompt - produce Z"],
            "requires_loop": true or false,
            "requires_branching": true or false,
            "input_schema": "description of what keys the user must provide in their initial state JSON",
            "output_path": "prime.<final_effect_name>.value"
          }

          Rules for the steps array:
          - Each entry must be a short phrase: "<step_N>: <effect_type> - <what it does>"
          - Include between 2 and 5 steps that logically decompose the goal
          - If requires_loop is true, include a loop step
          - If requires_branching is true, include an if step

          Return ONLY the JSON object. No explanation. No markdown.

      # ─── Step 2: Elaborate each planned step ─────────────────────────────────
      # Iterates over the steps array from the intent analysis (2–5 iterations).
      # Each iteration produces a YAML effect block stub for that step.
      # Stubs are stored at: prime.generate.elaborate_steps.iter_N.yaml_stub.value
      - type: loop
        name: elaborate_steps
        each:
          in: prime.generate.analyze_intent.value.steps
          as: step
        body:
          - type: prompt
            name: yaml_stub
            template: |
              You are writing a Circuitry YAML effect block.

              Step to implement: "{{step}}"
              Overall orchestration goal: {{prime.generate.analyze_intent.value.goal}}
              Requires loop: {{prime.generate.analyze_intent.value.requires_loop}}
              Requires branching: {{prime.generate.analyze_intent.value.requires_branching}}

              Write a single YAML effect block for this step using correct Circuitry syntax.

              Valid effect block examples:

                prompt:
                  type: prompt
                  name: <name>
                  template: "..."
                  prompt_type: text|json

                loop:
                  type: loop
                  name: <name>
                  each:
                    in: prime.<effect_name>.value
                    as: <variable_name>
                  body:
                    - type: prompt
                      name: <body_effect_name>
                      template: "..."

                if:
                  type: if
                  name: <name>
                  if:
                    mode: cel
                    expr: "state.prime.<name>.value == 'expected_value'"
                  then:
                    - type: prompt
                      name: <shared_name>
                      template: "..."
                  else:
                    - type: prompt
                      name: <shared_name>
                      template: "..."

              Return ONLY the YAML block for this one step. No markdown fences. No full orchestration file. No explanation.

      # ─── Step 3: Draft the complete orchestration YAML ───────────────────────
      # Assembles a complete Circuitry orchestration file using the structured
      # intent analysis as context. Per-step stubs from Step 2 are available in
      # state at prime.generate.elaborate_steps.iter_N.yaml_stub.value (N from 0)
      # and are referenced conceptually when composing the full YAML.
      - type: prompt
        name: draft_yaml
        template: |
          You are a Circuitry YAML expert. Write a complete, runnable Circuitry orchestration file based on the design plan below.

          User request: "{{user_request}}"
          Goal: {{prime.generate.analyze_intent.value.goal}}
          Planned steps (each quoted string is one step): {{prime.generate.analyze_intent.value.steps}}
          Requires loop: {{prime.generate.analyze_intent.value.requires_loop}}
          Requires branching: {{prime.generate.analyze_intent.value.requires_branching}}
          Input state keys the user provides: {{prime.generate.analyze_intent.value.input_schema}}
          Expected primary output state path: {{prime.generate.analyze_intent.value.output_path}}

          Note: Per-step YAML stubs were elaborated during Step 2 and are stored in state at
          prime.generate.elaborate_steps.iter_N.yaml_stub.value (N starts at 0). Use the planned
          steps above as your primary structural guide when writing the orchestration.

          CIRCUITRY YAML RULES — follow these exactly:
          - Top-level fields: adapter, model, effects (no other top-level keys)
          - adapter options: ollama, openai, anthropic, litellm
          - prompt: { type: prompt, name: str, template: str, prompt_type: text|json|boolean|number, schema: {...} (json only) }
          - dynamic: { type: dynamic, name: str, flow: chain|tree, effects: [...] }
          - if: { type: if, name: str, if: { mode: cel, expr: "state.prime.name.value == 'x'" }, then: [...], else: [...] }
          - loop: { type: loop, name: str, each: { in: prime.effect_name.value, as: var_name }, body: [...] }
          - Templates use Mustache: {{variable}} for initial state keys, {{prime.name.value}} for effect outputs
          - Nested effect outputs include parent dynamic name: {{prime.dynamic_name.effect_name.value}}
          - CEL expressions MUST use the full path prefix: state.prime.<name>.value
          - Loop each.in MUST point to a prompt_type: json effect whose output is an array
          - Use the same inner effect name in both then and else branches of any if effect

          Write the complete YAML. Add # comments explaining each section. Include a header comment block
          describing what the orchestration does, its input state keys, and primary output path.

          Start with: adapter: ollama

          Return ONLY the YAML. No markdown fences. No explanation outside of YAML comments.

      # ─── Step 4: Self-review and produce final output ────────────────────────
      # Best-effort structural review — catches common Circuitry errors in the
      # draft before returning the final output.
      # PRIMARY OUTPUT: prime.generate.final_yaml.value
      - type: prompt
        name: final_yaml
        template: |
          You are reviewing a Circuitry orchestration YAML for correctness. Work through each check below in order, fix any errors found, then output the complete final YAML.

          Original user request: "{{user_request}}"

          Draft YAML to review:
          <<< BEGIN DRAFT YAML >>>
          {{prime.generate.draft_yaml.value}}
          <<< END DRAFT YAML >>>

          Work through each check systematically before producing output:
          1. Does the file start with `adapter:` and include a `model:` field at the top level?
          2. Are all state path references in templates formatted as `prime.<name>.value` (not just `<name>` or `<name>.value`)?
          3. Does every loop effect.each.in point to a prompt_type: json effect that outputs an array?
          4. Do all CEL expressions use the full `state.prime.<name>.value` prefix (not `prime.<name>.value`)?
          5. Do all Mustache variables in templates correspond to real initial state keys or real effect outputs?
          6. Does every prompt have name + template? Every dynamic have effects? Every loop have body + each? Every if have if + then?
          7. Do nested effects inside a dynamic reference sibling outputs using the parent dynamic name in the path (e.g. prime.<dynamic_name>.<effect_name>.value)?

          After checking all seven items: if you found errors, output the corrected YAML. If the draft is correct, output it unchanged.

          Return ONLY the final YAML. No markdown fences. No explanations. No preamble.
