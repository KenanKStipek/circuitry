effects:
  # Produce the collection to iterate over
  - type: prompt
    name: topics
    prompt_type: json
    template: 'List exactly 3 programming languages as a JSON array. Return ONLY the array. Example: ["Python", "Rust", "Go"]'

  # each.in — dot-delimited state path to the array
  # each.as — name bound to the current element inside the body
  - type: loop
    name: explain
    each:
      in: prime.topics.value
      as: topic
    body:
      - type: prompt
        name: summary
        template: "Explain {{topic}} in one sentence."

  # each.in — dot-delimited state path to the array
  # each.as — name bound to the current element inside the body
  - type: loop
    name: explain_tree
    flow: tree
    each:
      in: prime.topics.value
      as: topic
    body:
      - type: prompt
        name: summary
        template: "Explain {{topic}} in one sentence."
