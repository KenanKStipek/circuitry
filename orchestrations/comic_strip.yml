name: comic_strip
description: |
  Generates a 3-panel Joking Hazard style comic strip from a prompt.
  Inputs: {{prompt}}
  Outputs: script JSON + 3 panel images in ./output/comics/

adapter: ollama
model: llama3:latest

effects:
  - name: generate_script
    type: prompt
    prompt_type: json
    template: |
      You are a comedy writer creating a Joking Hazard style 3-panel comic strip.

      Premise: {{prompt}}

      Write a dark, subversive, funny 3-panel comic strip script.
      Each panel has a visual scene (for image generation) and dialogue or caption text.
      The humor should be absurdist, crude, and unexpected — like Joking Hazard.

      Return ONLY valid JSON:
      {
        "title": "short comic title",
        "panel_1_scene": "what is visually depicted in panel 1, described for an image model — no text or speech bubbles",
        "panel_1_text": "dialogue or caption text for panel 1",
        "panel_2_scene": "what is visually depicted in panel 2",
        "panel_2_text": "dialogue or caption text for panel 2",
        "panel_3_scene": "what is visually depicted in panel 3",
        "panel_3_text": "dialogue or caption text for panel 3"
      }
    schema:
      type: object
      required: [title, panel_1_scene, panel_1_text, panel_2_scene, panel_2_text, panel_3_scene, panel_3_text]
      properties:
        title: {type: string}
        panel_1_scene: {type: string}
        panel_1_text: {type: string}
        panel_2_scene: {type: string}
        panel_2_text: {type: string}
        panel_3_scene: {type: string}
        panel_3_text: {type: string}

  - name: draw_panels
    type: dynamic
    flow: tree
    effects:
      - name: panel_1
        type: tool
        provider: comfyui
        prompt: "{{prime.generate_script.value.panel_1_scene}}, joking hazard comic style, simple black and white cartoon panel, crude humor, minimal background, expressive characters"
        model: flux1-dev-fp8.safetensors
        params:
          image_output: path
          image_dir: ./output/comics
          steps: 20
          cfg: 3.5
          sampler_name: euler
          scheduler: beta
          width: 512
          height: 512

      - name: panel_2
        type: tool
        provider: comfyui
        prompt: "{{prime.generate_script.value.panel_2_scene}}, joking hazard comic style, simple black and white cartoon panel, crude humor, minimal background, expressive characters"
        model: flux1-dev-fp8.safetensors
        params:
          image_output: path
          image_dir: ./output/comics
          steps: 20
          cfg: 3.5
          sampler_name: euler
          scheduler: beta
          width: 512
          height: 512

      - name: panel_3
        type: tool
        provider: comfyui
        prompt: "{{prime.generate_script.value.panel_3_scene}}, joking hazard comic style, simple black and white cartoon panel, crude humor, minimal background, expressive characters"
        model: flux1-dev-fp8.safetensors
        params:
          image_output: path
          image_dir: ./output/comics
          steps: 20
          cfg: 3.5
          sampler_name: euler
          scheduler: beta
          width: 512
          height: 512

  - name: overlay_text
    type: dynamic
    flow: tree
    effects:
      - name: panel_1_text
        type: tool
        provider: ffmpeg
        params:
          input: "{{prime.draw_panels.panel_1.value}}"
          vf_drawtext:
            text: "{{prime.generate_script.value.panel_1_text}}"
            x: (w-tw)/2
            y: h-th-20
            fontsize: 22
            fontcolor: white
            box: 1
            boxcolor: "black@0.75"
            boxborderw: 8
          output: "./output/comics/panel_1_with_text_{{_timestamp}}.png"

      - name: panel_2_text
        type: tool
        provider: ffmpeg
        params:
          input: "{{prime.draw_panels.panel_2.value}}"
          vf_drawtext:
            text: "{{prime.generate_script.value.panel_2_text}}"
            x: (w-tw)/2
            y: h-th-20
            fontsize: 22
            fontcolor: white
            box: 1
            boxcolor: "black@0.75"
            boxborderw: 8
          output: "./output/comics/panel_2_with_text_{{_timestamp}}.png"

      - name: panel_3_text
        type: tool
        provider: ffmpeg
        params:
          input: "{{prime.draw_panels.panel_3.value}}"
          vf_drawtext:
            text: "{{prime.generate_script.value.panel_3_text}}"
            x: (w-tw)/2
            y: h-th-20
            fontsize: 22
            fontcolor: white
            box: 1
            boxcolor: "black@0.75"
            boxborderw: 8
          output: "./output/comics/panel_3_with_text_{{_timestamp}}.png"

  - name: combine_panels
    type: tool
    provider: ffmpeg
    params:
      input: "{{prime.overlay_text.panel_1_text.value}}"
      extra_inputs:
        - "{{prime.overlay_text.panel_2_text.value}}"
        - "{{prime.overlay_text.panel_3_text.value}}"
      filter_complex: "hstack=inputs=3"
      output: "./output/comics/strip_{{_timestamp}}.png"
