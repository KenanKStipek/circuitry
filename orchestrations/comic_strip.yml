name: comic_strip
description: |
  Generates a 3-panel Joking Hazard style comic strip from a prompt.
  Inputs: {{prompt}}
  Outputs: script JSON + 3 panel images in ./output/comics/

adapter: ollama
model: llama3:latest

effects:
  - name: generate_script
    type: prompt
    prompt_type: json
    template: |
      You are a comedy writer creating a Joking Hazard style 3-panel comic strip.

      Premise: {{prompt}}

      Write a dark, subversive, funny 3-panel comic strip script.
      Each panel has a visual scene (for image generation) and dialogue or caption text.
      The humor should be absurdist, crude, and unexpected — like Joking Hazard.

      Return ONLY valid JSON:
      {
        "title": "short comic title",
        "panel_1_scene": "what is visually depicted in panel 1, described for an image model — no text or speech bubbles",
        "panel_1_text": "dialogue or caption text for panel 1",
        "panel_2_scene": "what is visually depicted in panel 2",
        "panel_2_text": "dialogue or caption text for panel 2",
        "panel_3_scene": "what is visually depicted in panel 3",
        "panel_3_text": "dialogue or caption text for panel 3"
      }
    schema:
      type: object
      required: [title, panel_1_scene, panel_1_text, panel_2_scene, panel_2_text, panel_3_scene, panel_3_text]
      properties:
        title: {type: string}
        panel_1_scene: {type: string}
        panel_1_text: {type: string}
        panel_2_scene: {type: string}
        panel_2_text: {type: string}
        panel_3_scene: {type: string}
        panel_3_text: {type: string}

  - name: draw_panels
    type: dynamic
    flow: tree
    effects:
      - name: panel_1
        type: prompt
        prompt_type: image
        provider: comfyui:flux1-dev-fp8.safetensors
        prompt: "{{prime.generate_script.value.panel_1_scene}}, joking hazard comic style, simple black and white cartoon panel, crude humor, minimal background, expressive characters"
        image_output: path
        image_dir: ./output/comics
        params:
          steps: 20
          cfg: 3.5
          sampler_name: euler
          scheduler: beta
          width: 512
          height: 512

      - name: panel_2
        type: prompt
        prompt_type: image
        provider: comfyui:flux1-dev-fp8.safetensors
        prompt: "{{prime.generate_script.value.panel_2_scene}}, joking hazard comic style, simple black and white cartoon panel, crude humor, minimal background, expressive characters"
        image_output: path
        image_dir: ./output/comics
        params:
          steps: 20
          cfg: 3.5
          sampler_name: euler
          scheduler: beta
          width: 512
          height: 512

      - name: panel_3
        type: prompt
        prompt_type: image
        provider: comfyui:flux1-dev-fp8.safetensors
        prompt: "{{prime.generate_script.value.panel_3_scene}}, joking hazard comic style, simple black and white cartoon panel, crude humor, minimal background, expressive characters"
        image_output: path
        image_dir: ./output/comics
        params:
          steps: 20
          cfg: 3.5
          sampler_name: euler
          scheduler: beta
          width: 512
          height: 512
