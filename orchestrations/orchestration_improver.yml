# Orchestration Improver
# ─────────────────────────────────────────────────────────────────────────────
# Takes an existing Circuitry orchestration YAML and an original intent prompt,
# analyzes the orchestration's quality, and produces a single improved version
# that is richer, more accurate to the original intent, and better utilizes
# Circuitry primitives.
#
# Designed to be called repeatedly by the `improve-orchestration` script,
# which drives the iteration loop, detects convergence, and saves state
# after each call.
#
# ─── USAGE ───────────────────────────────────────────────────────────────────
#
#   1. Run a single improvement pass directly:
#
#        echo '{"input_yaml": "...", "original_prompt": "..."}' > input.json
#        ./scripts/circuitry run orchestrations/orchestration_improver.yml \
#          --state input.json --out improved.json
#
#   2. Extract the improved YAML from state:
#
#        cat improved.json | python3 -c "
#          import sys, json
#          print(json.load(sys.stdin)['prime']['generate']['final_yaml']['value'])
#        "
#
#   3. Use the improve-orchestration script for iterative refinement:
#
#        ./scripts/improve-orchestration \
#          --orchestration path/to/orch.yml \
#          --prompt "original intent"
#
# ─── INPUT STATE ─────────────────────────────────────────────────────────────
#
#   Key              Type     Description
#   input_yaml       string   The current orchestration YAML to improve
#   original_prompt  string   The original intent/goal the orchestration was built for
#   rules            string   LLM authoring rules injected from docs/orchestration-reference.md
#
# ─── OUTPUT STATE PATHS ──────────────────────────────────────────────────────
#
#   prime.generate.final_yaml.value
#     → The improved orchestration YAML (primary output)
#
#   prime.generate.analyze_quality.value
#     → Quality analysis JSON: {issues, strengths, improvement_areas, alignment_score}
#
#   prime.generate.draft_yaml.value
#     → Initial improved draft (before self-review pass)
#
# ─── MODEL RECOMMENDATION ────────────────────────────────────────────────────
#
#   A capable model is strongly recommended for reliable YAML generation.
#   Small models may produce structurally invalid YAML.
#
#   Ollama (adapter: ollama):
#     model: qwen3:8b        → ollama pull qwen3:8b
#
#   Hosted APIs (verify model IDs against current provider docs):
#     model: claude-haiku-20240307   adapter: anthropic
#     model: gpt-4o-mini             adapter: openai
#     model: gemini/gemini-1.5-flash adapter: litellm
#
# ─────────────────────────────────────────────────────────────────────────────

effects:
  - type: dynamic
    name: generate
    flow: chain
    effects:
      # ─── Step 1: Analyze quality ───────────────────────────────────────────
      # Assess the current orchestration against the original intent.
      # Produces a structured JSON quality report identifying issues,
      # strengths, and concrete improvement areas.
      - type: prompt
        name: analyze_quality
        prompt_type: json
        schema:
          type: object
          properties:
            issues:
              type: array
              items:
                type: string
            strengths:
              type: array
              items:
                type: string
            improvement_areas:
              type: array
              items:
                type: string
            alignment_score:
              type: number
              minimum: 1
              maximum: 10
          required:
            - issues
            - strengths
            - improvement_areas
            - alignment_score
          additionalProperties: false
        template: |
          You are a Circuitry orchestration quality reviewer.

          Original intent: "{{original_prompt}}"

          Current orchestration YAML:
          <<< BEGIN YAML >>>
          {{input_yaml}}
          <<< END YAML >>>

          Analyze this orchestration's quality against the original intent. Consider:
          1. Does it fully achieve the original intent? Are any goals missing or underserved?
          2. Are the prompt templates rich, specific, and instructive enough to produce high-quality outputs?
          3. Are Circuitry primitives (loop, conditional, dynamic, reflector) used appropriately for the task?
          4. Are there missing steps or effects that would improve output quality or completeness?
          5. Are templates clear, well-structured, and free of ambiguity?
          6. Should any complex effect trees be broken into staged prompts (e.g., list → build → combine) rather than generated in a single shot?

          Return a JSON object with:
          - issues: list of specific problems found (be concrete, not vague)
          - strengths: list of what is working well and should be preserved
          - improvement_areas: list of concrete, actionable suggestions for improvement
          - alignment_score: integer 1–10 indicating how well this orchestration serves the original intent (10 = perfect alignment, 1 = completely misses the intent). The schema enforces this range.

          Return ONLY the JSON object. No explanation. No markdown.

      # ─── Step 2: Draft improved YAML ──────────────────────────────────────
      # Produce an improved orchestration that addresses the quality analysis.
      # Reads the analysis from Step 1 and the current YAML to produce a
      # richer, more complete version aligned to the original intent.
      - type: prompt
        name: draft_yaml
        template: |
          You are a Circuitry YAML expert improving an existing orchestration.

          Original intent: "{{original_prompt}}"

          Quality analysis of the current version:
          - Issues to fix: {{prime.generate.analyze_quality.value.issues}}
          - Strengths to preserve: {{prime.generate.analyze_quality.value.strengths}}
          - Improvements to make: {{prime.generate.analyze_quality.value.improvement_areas}}
          - Current alignment score: {{prime.generate.analyze_quality.value.alignment_score}}/10 (use this as a signal of how much work remains — low scores need structural changes, high scores may only need prompt enrichment)

          Current orchestration YAML to improve:
          <<< BEGIN CURRENT YAML >>>
          {{input_yaml}}
          <<< END CURRENT YAML >>>

          Produce an improved version that:
          1. Fixes every issue listed above
          2. Implements every improvement area
          3. Preserves the identified strengths
          4. More fully and richly achieves the original intent
          5. If the orchestration includes complex effect trees, split them into staged prompts (e.g., list running effect trees → build each tree → combine) rather than a single-shot generation, when this improves clarity or quality.

          {{rules}}

          Write the complete improved YAML. Add # comments explaining each section and include additional comments where relevant to clarify intent or behavior. Include a header comment block describing what the orchestration does, its inputs, and its primary output path.

          Return ONLY the YAML. No markdown fences. No explanation outside of YAML comments.

      # ─── Step 3: Self-review and produce final output ─────────────────────
      # Best-effort structural review — catches common Circuitry errors in the
      # draft before returning the final output. Mirrors the review pass in
      # meta_orchestrator.yml.
      # Note: this is not a structural guarantee — the same model that wrote
      # the draft is reviewing it. The improve-orchestration script additionally
      # strips markdown fences and the caller should validate the output via
      # `./scripts/circuitry validate` before relying on it in production.
      # PRIMARY OUTPUT: prime.generate.final_yaml.value
      - type: prompt
        name: final_yaml
        template: |
          You are reviewing improved Circuitry orchestration YAML for correctness. Work through each check below in order, fix any errors found, then output the complete final YAML.

          Original intent: "{{original_prompt}}"

          Draft YAML to review:
          <<< BEGIN DRAFT YAML >>>
          {{prime.generate.draft_yaml.value}}
          <<< END DRAFT YAML >>>

          Use the rules below as an internal checklist only. Do NOT write out your review or explain your reasoning. Silently fix any violations and preserve all relevant comments, then output the corrected YAML.

          {{rules}}

          Return ONLY the final YAML. No markdown fences. No explanations. No preamble. Start with `adapter:`.
