# Orchestration Improver Judge
# ─────────────────────────────────────────────────────────────────────────────
# Convergence judge for the orchestration self-improvement loop.
# Compares two orchestration YAML versions and returns true if they have
# converged (functionally equivalent or trivially different), false if they
# are meaningfully different and iteration should continue.
#
# Called by the improve-orchestration script as a secondary convergence signal
# after the SHA-256 hash check. Only invoked when hashes differ but the
# convergence window threshold is met.
#
# ─── USAGE ───────────────────────────────────────────────────────────────────
#
#   echo '{"yaml_a": "...", "yaml_b": "..."}' > judge-input.json
#   ./scripts/circuitry run orchestrations/orchestration_improver_judge.yml \
#     --state judge-input.json --out judge-output.json
#
#   cat judge-output.json | python3 -c "
#     import sys, json
#     print(json.load(sys.stdin)['prime']['judge']['value'])
#   "
#
# ─── INPUT STATE ─────────────────────────────────────────────────────────────
#
#   Key     Type     Description
#   yaml_a  string   Previous iteration orchestration YAML
#   yaml_b  string   Current iteration orchestration YAML
#
# ─── OUTPUT STATE PATHS ──────────────────────────────────────────────────────
#
#   prime.judge.value
#     → true  = orchestrations have converged (stop iterating)
#     → false = orchestrations are meaningfully different (continue iterating)
#
# ─── MODEL RECOMMENDATION ────────────────────────────────────────────────────
#
#   A fast/cheap model is sufficient for this binary classification task.
#   Consider overriding the default to a lighter model to reduce cost.
#
#   Ollama:   model: qwen3:4b  (lighter than the improver's qwen3:8b)
#   Hosted:   model: claude-haiku-20240307   adapter: anthropic
#             model: gpt-4o-mini             adapter: openai
#
# ─────────────────────────────────────────────────────────────────────────────

adapter: ollama
model: qwen3:8b

effects:
  - type: prompt
    name: sha256-check
    prompt_type: boolean
    template: "Are the SHA-256 hashes of the two YAML files identical? {{state.prime.sha256_hash_a.value}} == {{state.prime.sha256_hash_b.value}}"
    schema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        identical:
          type: boolean

  - type: prompt
    name: threshold-check
    prompt_type: boolean
    template: "Has the convergence window threshold been met? (Threshold value: {{state.prime.threshold_value.value}}) {{state.prime.threshold_met.value}}"
    schema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        threshold_met:
          type: boolean

  - type: dynamic
    name: compare-effects
    flow: chain
    effects:
      - type: loop
        in: state.prime.effect_name.value
        as: effect_name
        body:
          - type: prompt
            name: effect-compare
            prompt_type: boolean
            template: "Are the effects identical? {{state.prime.[effect_name].value}} == {{state.prime.[effect_name + '_b'].value}}"
            schema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                identical:
                  type: boolean

  - type: if
    name: convergence-decision
    then:
      - type: prompt
        name: converged
        prompt_type: boolean
        template: "Are the effects identical? {{state.prime.converged.value}}"
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            value:
              type: boolean
    else:
      - type: prompt
        name: not-converged
        prompt_type: boolean
        template: "Are the effects meaningfully different? {{state.prime.not_converged.value}}"
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            value:
              type: boolean

  - type: dynamic
    name: judge-output
    flow: chain
    effects:
      - type: prompt
        name: output-value
        prompt_type: boolean
        template: "{{# state.prime.converged.value }}true{{/ state.prime.converged.value }}{{# !state.prime.converged.value }}false{{/ !state.prime.converged.value }}"
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            value:
              type: boolean

output:
  - path: state.prime.judge.value
    type: boolean
