# Orchestration Improver Judge
# ─────────────────────────────────────────────────────────────────────────────
# Convergence judge for the orchestration self-improvement loop.
# Compares two orchestration YAML versions and returns true if they have
# converged (functionally equivalent or only trivially different), false if
# they are meaningfully different and iteration should continue.
#
# Called by the improve-orchestration script as a secondary convergence signal
# after the SHA-256 hash check. Only invoked when hashes differ but the
# convergence window threshold is met.
#
# ─── INPUT STATE ─────────────────────────────────────────────────────────────
#
#   Key     Type     Description
#   yaml_a  string   Previous iteration orchestration YAML
#   yaml_b  string   Current iteration orchestration YAML
#
# ─── OUTPUT STATE PATH ───────────────────────────────────────────────────────
#
#   prime.judge.value
#     → true  = orchestrations have converged (stop iterating)
#     → false = orchestrations are meaningfully different (continue iterating)
#
# ─────────────────────────────────────────────────────────────────────────────

effects:
  - type: prompt
    name: judge
    prompt_type: boolean
    template: |
      You are evaluating whether two Circuitry orchestration YAML versions have converged.

      Return true if the two versions are functionally equivalent or differ only in trivial
      ways (whitespace, comments, reordered fields with identical meaning, cosmetic renames).

      Return false if version B represents a meaningful structural or behavioural improvement
      over version A — different effects, better prompts, fixed logic, added steps, etc.

      Version A (previous iteration):
      <<< BEGIN YAML A >>>
      {{yaml_a}}
      <<< END YAML A >>>

      Version B (current iteration):
      <<< BEGIN YAML B >>>
      {{yaml_b}}
      <<< END YAML B >>>

      Return ONLY a JSON boolean: true if converged (stop iterating), false if meaningfully different (keep iterating).
