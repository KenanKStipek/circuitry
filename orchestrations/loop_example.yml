# Example: Loop over a collection of items
adapter: ollama
model: qwen3:8b
effects:
  - type: prompt
    name: generate_topics
    prompt_type: json
    template: 'Generate a list of exactly 3 programming languages as a JSON array. Return ONLY the JSON array, nothing else. Example: ["Python", "Rust", "Go"]'

  - type: loop
    name: explain_topics
    each:
      in: prime.generate_topics.value
      as: topic
    body:
      - type: prompt
        name: explain
        template: "Explain {{topic}} in one sentence."
