[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
publish = false

# electricity-yaml's composer recurses once per nesting level (bounded by
# its own MAX_DEPTH, never unbounded) and is exercised, deliberately, on a
# 2 MiB thread stack -- a deliberately small, conservative size, not a
# measured figure for any specific caller (`tests/nesting_limit.rs`'s own
# module doc comment). An unoptimized (`opt-level = 0`) debug build's
# stack frames for that
# recursion are several times larger than an optimized build's (no dead
# local elimination, no frame-slot reuse across statements), enough to
# overflow a 2 MiB stack well under MAX_DEPTH even though the exact same
# document parses fine in `--release`. Compiling just this crate (not the
# rest of the dev-profile workspace, which stays fast to iterate on) with
# some optimization keeps `cargo test --workspace`'s default debug build
# -- what CI runs -- within the same stack budget as release.
[profile.dev.package.electricity-yaml]
opt-level = 2

# electricity-cel pre-rejects an expression nesting (parens/brackets)
# deeper than `electricity_cel::MAX_NESTING_DEPTH` before ever handing it
# to the `cel` crate's own ANTLR-generated parser (`nesting.rs`'s module
# docs) -- but that pre-scan only protects expressions it runs on; the
# parser and evaluator underneath still recurse once per nesting level up
# to whatever `MAX_NESTING_DEPTH` allows through. Measured directly
# (`tests/nesting_limit.rs`'s module docs): an unoptimized debug build of
# `cel` and its own ANTLR runtime, `antlr4rust`, overflowed a 2 MiB thread
# stack at as little as 12 levels of nested parentheses -- an order of
# magnitude below any limit that would still be useful. Optimizing these
# two crates (plus `electricity-cel` itself, which also recurses in
# `convert::to_cel`) the same way `electricity-yaml` already is above
# keeps `MAX_NESTING_DEPTH` safe on that same 2 MiB stack in debug, not
# just `--release`.
[profile.dev.package.electricity-cel]
opt-level = 2
[profile.dev.package.cel]
opt-level = 2
[profile.dev.package.antlr4rust]
opt-level = 2

# electricity-compiler's structural checks (the near-miss unknown-key
# walk, the group: placement walk, and the Value -> JSON-Schema-instance
# conversion feeding the jsonschema crate's own recursive validator) walk
# a document once per nesting level, same as electricity-yaml's composer
# above -- confirmed directly (issue #408's lane B depth-safety test,
# tests/depth_safety.rs): an unoptimized debug build overflows a 2 MiB
# thread stack at 255 levels of nested `dynamic` effects, well under
# electricity-yaml's own MAX_DEPTH (512) for that shape. electricity-schema
# feeds the same jsonschema crate's own recursive validator and shares the
# same fix.
[profile.dev.package.electricity-compiler]
opt-level = 2
[profile.dev.package.electricity-schema]
opt-level = 2
[profile.dev.package.jsonschema]
opt-level = 2
