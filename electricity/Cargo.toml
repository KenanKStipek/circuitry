[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
publish = false

# electricity-yaml's composer recurses once per nesting level (bounded by
# its own MAX_DEPTH, never unbounded) and is exercised, deliberately, on a
# 2 MiB thread stack -- a deliberately small, conservative size, not a
# measured figure for any specific caller (`tests/nesting_limit.rs`'s own
# module doc comment). An unoptimized (`opt-level = 0`) debug build's
# stack frames for that
# recursion are several times larger than an optimized build's (no dead
# local elimination, no frame-slot reuse across statements), enough to
# overflow a 2 MiB stack well under MAX_DEPTH even though the exact same
# document parses fine in `--release`. Compiling just this crate (not the
# rest of the dev-profile workspace, which stays fast to iterate on) with
# some optimization keeps `cargo test --workspace`'s default debug build
# -- what CI runs -- within the same stack budget as release.
[profile.dev.package.electricity-yaml]
opt-level = 2
