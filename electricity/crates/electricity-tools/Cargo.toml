[package]
name = "electricity-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "ToolPlugin trait, registry, and the json tool for electricity (electricity-tools, lane C stub)"

[features]
default = []
# Blocking `sleep`/`fail` test tools, for the signal-handling test suite
# only (issue #431's acceptance criteria) -- never compiled into a
# release build.
test-tools = []

[dependencies]
electricity-value = { path = "../electricity-value" }
electricity-json = { path = "../electricity-json" }
# `preview_marker_codec_error`'s own `PREVIEW_MARKER` (issue #476): the
# one shared constant every preview refusal across the workspace is
# built from, so this crate's codec refusal carries the exact same
# marker text as `electricity-bytecode`'s own `format_refusal` without
# a second, hand-copied literal to keep in sync.
electricity-bytecode = { path = "../electricity-bytecode" }
# Python-`re` pattern-syntax translation (#448 lane D2), shared with
# `electricity-schema` -- moved out of this crate (PR #502's round-4
# fix, finding F2) so both can depend on it without `electricity-schema`
# needing every other tool plugin's own dependency tree.
electricity-pyre = { path = "../electricity-pyre" }
# `http_error_excerpt`'s own `redact()` call (`plugins/base.py::
# http_error_excerpt`'s own doc comment: the deny-list, not an
# unredacted raw body, ever reaches a failure message) -- the same
# crate `electricity-vm`'s `exec/tool.rs` already redacts `meta.raw`/
# `meta.params_rendered` with.
electricity-redaction = { path = "../electricity-redaction" }
# `http.rs`'s own header map (insertion order matters for `Request.
# add_header`'s own capitalize-collapse, "a later one wins, never
# moved" -- the same ordered-map guarantee `electricity-value`'s own
# `Dict` already relies on this crate for).
indexmap = "2"
async-trait = "0.1"
# `regex` (plugins/regex.py, #448 decision 7): a Python-`re`-syntax
# translation layer over `fancy-regex`, the engine already pinned in
# the workspace lockfile (a transitive dependency of `jsonschema`, via
# `electricity-schema`) -- DESIGN.md §7.3.
fancy-regex = "0.14"
# Non-optional as of lane C (#459): `process.rs`'s own `run_tracked`
# needs tokio's process/io-util/time/rt features unconditionally, not
# only behind `test-tools`.
# `http_client`'s own connect/read/cancellation-abort plumbing (lane E,
# #485) needs `net` (raw `TcpStream`) on top of lane C's own set.
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "net"] }
libc = "0.2"
# The shared HTTP client (`http_client/`, #448 decision 1 plus the
# settled stack question in #485): `hyper`'s own low-level client,
# never `reqwest` -- `reqwest::Client` always inserts an `Accept: */*`
# default header (confirmed empirically against a loopback server: the
# mock harness records every header but `User-Agent`, so any header
# urllib itself never sends fails the request-record comparison) and
# `reqwest::Response` has no way to read back a server's own,
# non-canonical reason phrase (`hyper`'s `http::Extensions`-carried
# `hyper::ext::ReasonPhrase`, confirmed present on a plain `hyper`
# response, is never exposed through `reqwest`'s own `StatusCode`,
# which only ever returns the RFC canonical text) -- both are required
# ("Settled questions" in #485: urllib's own, exact header set; the
# server's own reason phrase, blank included). One connection per
# request/redirect hop, no pooling (`client-legacy`'s own keep-alive
# pool would still be `reqwest`-shaped complexity this lane's single-
# request-at-a-time model doesn't need): `hyper::client::conn::http1`
# directly, driven by a spawned task this crate's own cancellation
# guard can abort outright, closing the socket, the moment the caller
# drops the `send` future -- never automatic decompression, never
# HTTP/2 (#448 decision 1).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
# rustls with the system trust store (#448 decision 1) -- never
# OpenSSL (no system package to find/link on every CI platform) and
# never a bundled CA list (`webpki-roots`) on its own: `rustls-native-
# certs` reads the same OS trust store (the macOS Keychain, Linux's
# `/etc/ssl/certs`) `urllib`/curl's own TLS stack already does, so a
# corporate MITM proxy's locally-installed root still works here
# exactly as it does for `cof run`.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging", "ring"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
# `build_client`'s own unreadable-native-certificate warning, the same
# `log::warn!` convention #452 already settled on elsewhere in this
# workspace (`electricity-vm`'s own `Cargo.toml`).
log = "0.4"
# `hash` (plugins/hash.py): hashlib's own algorithm set, split across
# the RustCrypto family's per-algorithm crates (same `digest` 0.10 line
# as the workspace's existing `sha2` dependency, so there's only ever
# one `Digest` trait shape to call through).
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
digest = "0.10"
# `hash`'s own `output_format: base64` -- standard alphabet, padded.
base64 = "0.22"
# `uuid` (plugins/uuid.py): v1/v4/v5 generation, `NAMESPACE_DNS`/`_URL`/
# `_OID`/`_X500` and `uuid5`'s own SHA-1 construction all byte-identical
# to CPython's `uuid` module (verified directly against it).
uuid = { version = "1", features = ["v1", "v4", "v5"] }
# `clock` (plugins/clock.py): a `timezone:` lookup has to read the
# system tz database the way `zoneinfo.ZoneInfo` does -- a zone
# compiled into a crate (`chrono-tz`) would accept a different set of
# names than the host's own `/usr/share/zoneinfo` (#448 decision 8).
# `jiff`, not `tzfile`: `jiff` evaluates a TZif file's own POSIX-TZ
# footer for an instant past its last explicit transition (a "slim"
# tzdata build keeps only a handful of explicit transitions and relies
# on the footer for everything past them) and searches `TZDIR`/the
# usual zoneinfo search path the way `zoneinfo.ZoneInfo` does; `tzfile`
# 0.1.3 documents that it does not evaluate the footer at all.
jiff = "0.2"
# `clock`'s own `%<other>` directives (everything but the `%f`/`%z`/
# `%Z` CPython pre-processes itself -- #448 decision 8) go to the
# platform's own C `strftime`, not a pure-Rust reimplementation of it.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "time", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
