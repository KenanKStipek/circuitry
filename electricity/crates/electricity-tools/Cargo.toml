[package]
name = "electricity-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "ToolPlugin trait, registry, and the json tool for electricity (electricity-tools, lane C stub)"

[features]
default = []
# Blocking `sleep`/`fail` test tools, for the signal-handling test suite
# only (issue #431's acceptance criteria) -- never compiled into a
# release build.
test-tools = []

[dependencies]
electricity-value = { path = "../electricity-value" }
electricity-json = { path = "../electricity-json" }
async-trait = "0.1"
# Non-optional as of lane C (#459): `process.rs`'s own `run_tracked`
# needs tokio's process/io-util/time/rt features unconditionally, not
# only behind `test-tools`.
tokio = { version = "1", features = ["process", "io-util", "time", "rt"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "time", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
