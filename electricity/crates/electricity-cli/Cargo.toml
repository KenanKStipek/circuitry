[package]
name = "electricity-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "electricity CLI binary (preview)"

[[bin]]
name = "electricity"
path = "src/main.rs"

[features]
# Never enabled here: a release build of this binary never registers
# `sleep`/`fail`, and never builds a `scripted` adapter ahead of a real
# run. The signal-handling test suite enables it explicitly
# (`cargo test -p electricity-cli --features test-tools --test signals`),
# and `tests/leftover_export.rs` enables it to drive issue #478's own
# exit-path wiring end to end (no document can make `scripted` load
# until lane G flips `prompt`).
test-tools = ["electricity/test-tools", "dep:electricity-adapters"]

[dependencies]
electricity = { path = "../electricity" }
# Only to let `register_test_only_scripted_adapter` (`test-tools`-gated,
# `main.rs`) build a real `scripted` adapter directly -- never a
# dependency of the plain binary.
electricity-adapters = { path = "../electricity-adapters", optional = true }
electricity-config = { path = "../electricity-config" }
electricity-value = { path = "../electricity-value" }
libc = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Ties USAGE's own "runs ... documents only" / "refused" lists to
# Supported::current()'s own flags (a test-only need; the binary
# itself never reads this crate).
electricity-bytecode = { path = "../electricity-bytecode" }
