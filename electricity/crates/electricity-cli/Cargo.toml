[package]
name = "electricity-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "electricity CLI binary (preview)"

[[bin]]
name = "electricity"
path = "src/main.rs"

[features]
# Never enabled here: a release build of this binary never registers
# `sleep`/`fail`. The signal-handling test suite enables it explicitly
# (`cargo test -p electricity-cli --features test-tools --test signals`).
test-tools = ["electricity/test-tools"]

[dependencies]
electricity = { path = "../electricity" }
libc = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
