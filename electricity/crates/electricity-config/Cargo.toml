[package]
name = "electricity-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "config.json -> effective settings for electricity orchestrations (electricity-config, lane D stub)"

[dependencies]
electricity-value = { path = "../electricity-value" }
electricity-json = { path = "../electricity-json" }
# `runtime_env_secrets`'s own well-formedness check (issue #725) --
# `electricity_bytecode::secrets` is the one shared, dependency-cycle-
# free home for the `{secret: ...}` shape predicates both this crate
# and `electricity-compiler` need.
electricity-bytecode = { path = "../electricity-bytecode" }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
# `logger.warning` parity for `CircuitryConfig.from_dict`'s own "Unknown
# environment" fallback (issue #442) -- a no-op unless a binary later
# installs a logger, same as electricity-cel's own use of this crate.
log = "0.4"
# `config_trust`'s own digest -- the same crate/version the workspace
# already depends on for `hash`'s `sha256` provider (electricity-tools).
sha2 = "0.10"

[dev-dependencies]
# `Value::Date`/`Value::DateTime` test fixtures only -- the CompareError
# text ported in `profile.rs`'s own `py_sort_values`.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `golden_config.rs`'s own `complexity_yaml` case kind: a non-string
# `runtime.complexity` mapping key only survives as such when parsed
# from real YAML text, never through the corpus's own JSON encoding
# (issue #536).
electricity-yaml = { path = "../electricity-yaml" }
