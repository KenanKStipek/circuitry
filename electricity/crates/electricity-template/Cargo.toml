[package]
name = "electricity-template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A chevron port (Mustache) over electricity-value's Value, matching Circuitry's core/templates.py"

[dependencies]
electricity-value = { path = "../electricity-value" }
# `step`'s own named-attribute lookup on a `Value::Date`/`Value::DateTime`
# (`year`/`month`/`day`/`hour`/`minute`/`second`/`microsecond`, circuitry#389)
# needs `Datelike`/`Timelike` outside of tests too.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
