[package]
name = "electricity-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The M0-H VM: store, execution, cancellation, limiter (electricity-vm, lane B/C stub)"

[dependencies]
electricity-value = { path = "../electricity-value" }
electricity-bytecode = { path = "../electricity-bytecode" }
# `RunContext::complexity` (issue #449's gate lane item 6) -- this crate
# depends on `electricity-config`, matching DESIGN.md §2's own direction
# ("config → compiler, vm, tools, adapters, runtime-plugins": everyone
# reads config, config reads nothing).
electricity-config = { path = "../electricity-config" }
# Lane K2 (issue #516): `complexity::score_and_route` calls straight
# into K1's pure scorer/router library.
electricity-complexity = { path = "../electricity-complexity" }
electricity-tools = { path = "../electricity-tools" }
electricity-template = { path = "../electricity-template" }
electricity-json = { path = "../electricity-json" }
electricity-redaction = { path = "../electricity-redaction" }
# Pre-added now so neither lane has to touch this file: a path-`use`
# child is compiled at run time
# (lane I, `exec::use_::execute_use`), which needs this crate's own
# `prepare_document`/compile pipeline; a `prompt` effect's own `schema:`
# (lane G) is validated the same way `electricity-compiler` already
# validates Circuitry's own schemas, through `electricity-schema`.
# Neither creates a cycle: `electricity-compiler`/`electricity-schema`
# depend on neither `electricity-vm` nor each other in that direction.
electricity-compiler = { path = "../electricity-compiler" }
electricity-schema = { path = "../electricity-schema" }
# `exec::conditional`'s own CEL `if` evaluation (`evaluate_condition`).
electricity-cel = { path = "../electricity-cel" }
# `adapter::Adapter`'s own object-safety (issue #449's gate lane item 4),
# the same reason `electricity-tools::ToolPlugin` needs it.
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }
# `exec::dynamic`'s own tree-flow dispatch: a bounded set of concurrent,
# non-`'static` branch futures polled from one task (issue #431's Lane B
# section: "FuturesUnordered", not `tokio::task::spawn_local`).
futures = { version = "0.3", default-features = false, features = ["std"] }
# Full-jitter retry backoff (`core/tool.py`'s own `next_backoff_delay_ms`,
# `adapters/_retry.py`) -- a timing jitter, not a security-sensitive value,
# so no particular distribution fidelity with Python's own `random.uniform`
# is required, only "a random delay up to the computed ceiling".
rand = "0.8"
# `created_at`/`completed_at` timestamps, Python `isoformat()`-compatible --
# the conformance/golden-corpus normalizer only ever matches the
# `YYYY-MM-DDTHH:MM:SS` prefix (`_ISO_TS_RE`), so exact microsecond/offset
# formatting fidelity beyond that isn't required either.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# `logger.warning` parity for `core/dynamic.py`/`core/conditional.py`'s
# own on_error/finally degradation warnings (issue #442) -- a no-op
# unless a binary later installs a logger, same as electricity-cel's.
log = "0.4"
# `exec::use_`'s own inline-child identity/digest (M1 lane I, issue
# #469): `core/use.py::_load_child_orch`'s own
# `hashlib.sha256(cleaned.encode("utf-8")).hexdigest()` -- the same
# crate `electricity-compiler::digest` already hashes a file-based
# child's own bytes with.
sha2 = "0.10"
# `exec::use_`'s own inline-child YAML parse (`load_yaml(cleaned)`,
# `core/use.py::_load_child_orch`) -- the same parser
# `electricity-compiler::load` uses for a file-based child.
electricity-yaml = { path = "../electricity-yaml" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
# `raw_value` -- the compose golden corpus's own JSON `ctx`/node objects
# replay as `electricity_value::Dict`, whose own insertion order is part
# of what a `{{d}}`/`py_repr` splice renders; `serde_json`'s default
# `Map` is a `BTreeMap` (alphabetical), which would silently reorder a
# multi-key object on the way in. A `preserve_order` feature would fix
# that for this crate's own corpus fields, but `cargo test --workspace`
# unifies dev-dependency features across the whole workspace (Cargo's
# own feature-unification rule), so it would also switch every *other*
# crate's `serde_json::Value`/`Map` -- including `electricity-compiler`'s
# own JSON-schema recursion in `schema_instance.rs` -- onto a heavier,
# `IndexMap`-backed `Map`, which grows that recursion's own stack frames
# enough to overflow in `depth_safety`'s 255-level cases (confirmed: the
# unified binary overflows 3/3 locally; `cargo test -p electricity-compiler`
# alone, built without this crate's dev-dependencies, does not). `raw_value`
# carries no such risk (`[features] raw_value = []`, no deps of its own):
# corpus case structs capture a field needing order as a boxed
# `serde_json::value::RawValue` (the original JSON bytes, untouched) and
# re-parse just that slice through `electricity_json::loads`, this
# crate's own hand-rolled, always order-preserving reader -- never through
# `serde_json::Value` at all.
serde_json = { version = "1", features = ["raw_value"] }
async-trait = "0.1"
# `test-tools`'s own `flaky_build` builder (S1's own test: a fallible
# per-attempt plugin *builder*, not just a flaky `execute`) -- only ever
# active for this crate's own test target, never a release build.
electricity-tools = { path = "../electricity-tools", features = ["test-tools"] }
