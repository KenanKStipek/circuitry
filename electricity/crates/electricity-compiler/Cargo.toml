[package]
name = "electricity-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Load-and-check pipeline + compiler for electricity orchestrations (electricity-compiler)"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
regex = "1"
num-traits = "0.2"
electricity-value = { path = "../electricity-value" }
electricity-yaml = { path = "../electricity-yaml" }
electricity-json = { path = "../electricity-json" }
electricity-template = { path = "../electricity-template" }
electricity-cel = { path = "../electricity-cel" }
electricity-schema = { path = "../electricity-schema" }
electricity-bytecode = { path = "../electricity-bytecode" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
