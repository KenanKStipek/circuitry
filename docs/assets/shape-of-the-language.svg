<text x="830.0" y="-14.2" font-size="28" fill="#e9ecef" text-anchor="middle">Circuitry — the shape of the language</text>
<text x="793.6" y="107.0" font-size="13" fill="#adb5bd" text-anchor="middle">effects+</text>
<text x="201.6" y="197.1" font-size="13" fill="#adb5bd" text-anchor="middle">is one of</text>
<text x="1072.2" y="143.1" font-size="13" fill="#69db7c" text-anchor="middle">contain effects ⟳</text>
<text x="262.9" y="45.0" font-size="13" fill="#b197fc" text-anchor="middle">use runs a child document ⟳</text>
<text x="248.4" y="469.1" font-size="13" fill="#ffa94d" text-anchor="middle">writes</text>
<text x="423.4" y="469.1" font-size="13" fill="#ffa94d" text-anchor="middle">reads</text>
<text x="1102.6" y="31.0" font-size="13" fill="#ffa94d" text-anchor="middle">emits child documents ⟳</text>
<text x="134.0" y="255.1" font-size="13" fill="#9aa1a8" text-anchor="middle">leaf — no children</text>
<text x="659.0" y="255.1" font-size="13" fill="#9aa1a8" text-anchor="middle">structure</text>
<text x="1059.0" y="255.1" font-size="13" fill="#69db7c" text-anchor="middle">cybernetic — state steers</text>
<text x="735.0" y="50.7" font-size="22" fill="#b197fc" text-anchor="middle">Orchestration</text>
<text x="735.0" y="77.0" font-size="13" fill="#9aa1a8" text-anchor="middle">one YAML document</text>
<text x="735.0" y="150.7" font-size="22" fill="#f783ac" text-anchor="middle">Effect</text>
<text x="735.0" y="173.1" font-size="13" fill="#9aa1a8" text-anchor="middle">the unit of execution</text>
<text x="290.0" y="303.0" font-size="20" fill="#96f2d7" text-anchor="middle">prompt</text>
<text x="290.0" y="329.1" font-size="13" fill="#9aa1a8" text-anchor="middle">monad — one model call</text>
<text x="395.0" y="385.0" font-size="20" fill="#63e6be" text-anchor="middle">tool</text>
<text x="395.0" y="411.1" font-size="13" fill="#9aa1a8" text-anchor="middle">deterministic plugin</text>
<text x="165.0" y="385.0" font-size="20" fill="#63e6be" text-anchor="middle">use</text>
<text x="165.0" y="411.1" font-size="13" fill="#9aa1a8" text-anchor="middle">runs another document</text>
<text x="735.0" y="330.0" font-size="20" fill="#96f2d7" text-anchor="middle">dynamic</text>
<text x="735.0" y="356.1" font-size="13" fill="#9aa1a8" text-anchor="middle">monad — chain | tree</text>
<text x="1055.0" y="303.0" font-size="20" fill="#63e6be" text-anchor="middle">if</text>
<text x="1055.0" y="329.1" font-size="13" fill="#9aa1a8" text-anchor="middle">picks one branch</text>
<text x="1285.0" y="303.0" font-size="20" fill="#63e6be" text-anchor="middle">loop</text>
<text x="1285.0" y="329.1" font-size="13" fill="#9aa1a8" text-anchor="middle">repeats a body</text>
<text x="1170.0" y="385.0" font-size="20" fill="#63e6be" text-anchor="middle">reflector</text>
<text x="1170.0" y="411.1" font-size="13" fill="#9aa1a8" text-anchor="middle">plans its own effects</text>
<text x="450.0" y="521.0" font-size="20" fill="#ffa94d" text-anchor="middle">STATE</text>
<text x="450.0" y="547.0" font-size="13" fill="#9aa1a8" text-anchor="middle">input. · prime. · runtime.</text>
<text x="1185.0" y="521.0" font-size="20" fill="#ffa94d" text-anchor="middle">complexity (optional)</text>
<text x="1185.0" y="547.0" font-size="13" fill="#9aa1a8" text-anchor="middle">score → route → decompose</text>
<text x="604.0" y="603.0" font-size="13" fill="#adb5bd" text-anchor="middle">bright = the two base monads · leaves act · structure arranges both neighbors · cybernetics steer by reading STATE</text>
<text x="614.1" y="629.0" font-size="13" fill="#adb5bd" text-anchor="middle">green ⟳ holds effects again · purple = composition · coral = the runtime loop · every cycle bounded by max_iterations / max_depth</text>
</svg>