[package]
name = "oscilloscope-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "osi (oscilloscope) core library: plan, observe, model, diff, engine, supervise — no terminal code, so a future GUI can reuse it"

[dependencies]
# Relative to this crate: crates/oscilloscope-core -> oscilloscope -> repo
# root -> electricity/crates/... . Proves (CI job `electricity/crates/**`
# path filter) that an electricity change which breaks the compiler or
# bytecode IR also breaks osi, in the same pass.
electricity-compiler = { path = "../../../electricity/crates/electricity-compiler" }
electricity-bytecode = { path = "../../../electricity/crates/electricity-bytecode" }
# check_options/parse_inputs (K4): the exact CheckOptions a real
# `electricity <config> <doc> -e k=v...` run would use, so osi's own
# plan compile never drifts from what electricity itself checks a
# document against.
electricity = { path = "../../../electricity/crates/electricity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"
chrono = "0.4"
indexmap = "2"
# config_discovery's own project-config trust digest (matches
# cli/config_trust.py's SHA-256, already used the same way by
# electricity-compiler's own prompt-file confinement).
sha2 = "0.10"
# plan::compile_with_discovery writes its own discovered config to a
# throwaway file for `compile`'s existing `Some(path)` branch to read
# (electricity::check_options takes a path, never a parsed value).
tempfile = "3"

[dev-dependencies]
electricity-value = { path = "../../../electricity/crates/electricity-value" }
insta = "1"
