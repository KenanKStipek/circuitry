[package]
name = "oscilloscope-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "osp (oscilloscope) core library: plan, observe, model, diff, engine, supervise — no terminal code, so a future GUI can reuse it"

[dependencies]
# Relative to this crate: crates/oscilloscope-core -> oscilloscope -> repo
# root -> electricity/crates/... . Proves (CI job `electricity/crates/**`
# path filter) that an electricity change which breaks the compiler or
# bytecode IR also breaks osp, in the same pass.
electricity-compiler = { path = "../../../electricity/crates/electricity-compiler" }
electricity-bytecode = { path = "../../../electricity/crates/electricity-bytecode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
electricity-value = { path = "../../../electricity/crates/electricity-value" }
