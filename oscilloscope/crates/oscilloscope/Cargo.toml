[package]
name = "oscilloscope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "osi: a preview terminal UI that watches and launches a Circuitry orchestration run on cof or electricity"

[[bin]]
name = "osi"
path = "src/main.rs"

[dependencies]
oscilloscope-core = { path = "../oscilloscope-core" }
# Pinned (not "4"): every dependency here must build on rust-version
# 1.86 (workspace MSRV); clap 4.6.7 declares rust-version = "1.85" and
# is the newest 4.6.x line that does.
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned (not "0.30"): ratatui 0.30.2 declares rust-version 1.88,
# newer than the workspace MSRV (1.86); 0.30.0 is the newest 0.30.x
# that still builds on 1.86. default-features off: "all-widgets"
# (termwiz/termion backends, the calendar widget) pulls in dependencies
# osi's own TUI never uses; "crossterm" alone (ratatui-crossterm's own
# default feature) brings in crossterm 0.29, pinned to match directly
# below so osi's own signal/raw-mode calls and ratatui's backend never
# disagree about which crossterm they're linking.
# "unstable-rendered-line-info" (finding F8): `Paragraph::line_count`,
# the only way to clamp the details pane's own scroll to its *wrapped*
# line count rather than its logical one — on a narrow layout a long
# `prompt_sent`/value wraps to more lines than it has of its own, and
# `End` must still be able to reach the last of them.
ratatui = { version = "=0.30.0", default-features = false, features = [
    "crossterm",
    "underline-color",
    "unstable-rendered-line-info",
] }
crossterm = "0.29"
# A raw, non-blocking `libc::poll` on
# the tty fd itself (`terminal_fd_hung_up`, main.rs) is the only thing
# that catches a hung-up pty with no controlling terminal to raise a
# real SIGHUP over it -- crossterm's own event source (`event::source::
# unix::tty::try_read`) checks only `revents & POLLIN`, never
# `POLLHUP`/`POLLERR`/`POLLNVAL`, so it never surfaces one as an error
# at all.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
insta = "1"
# Only for the TUI's own golden tests, which build a small plan by
# hand the same way oscilloscope-core's own plan.rs tests do (K4):
# no new code path exercises these two outside `#[cfg(test)]`.
electricity-bytecode = { path = "../../../electricity/crates/electricity-bytecode" }
electricity-value = { path = "../../../electricity/crates/electricity-value" }
