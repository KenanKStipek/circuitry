interface:
  inputs:
    issue: {type: string, default: "parse_duration fails on 1h30m with ValueError: invalid duration. 90m works."}
    topics: {type: array, default: ["cats", "dogs", "birds"]}
effects:
  - name: kind
    type: prompt
    template: "Is this issue a bug, a feature or a question? Answer with one word. Issue: {{input.issue}}"
  - name: tests
    type: tool
    provider: shell
    params: {command: sleep, args: ["3"], allowed_commands: ["sleep"]}
  - name: gate
    type: if
    if: {mode: cel, expr: 'state.prime.kind.value != ""'}
    then:
      - name: reply
        type: prompt
        template: "Reply as the maintainer (kind: {{prime.kind.value}}). Issue: {{input.issue}}"
    else:
      - name: reply
        type: tool
        provider: shell
        params: {command: echo, args: ["no kind"]}
  - name: drafts
    type: loop
    flow: tree
    max_concurrency: 2
    each: {in: input.topics, as: topic}
    body:
      - name: draft
        type: prompt
        template: "Write one sentence about {{topic}}."
      - name: pause
        type: tool
        provider: shell
        params: {command: sleep, args: ["1"], allowed_commands: ["sleep"]}
  - name: flaky
    type: tool
    provider: shell
    on_error: continue
    params: {command: ls, args: ["/nonexistent-osi-demo"]}
  - name: summary
    type: prompt
    template: "Summarize the drafts in one line."
