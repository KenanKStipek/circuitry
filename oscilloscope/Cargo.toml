[workspace]
resolver = "3"
members = ["crates/*"]

# Copied from ../electricity/Cargo.toml: osi depends on electricity-compiler/
# electricity-bytecode by path, which pull in electricity-cel, so this
# workspace needs the same vendored `cel` (`../electricity/vendor/cel`,
# `../electricity/vendor/cel/VENDORING.md`) a `[patch.crates-io]` is
# per-workspace, not inherited through a path dependency.
[patch.crates-io]
cel = { path = "../electricity/vendor/cel" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
publish = false

# Copied from ../electricity/Cargo.toml (#422 review): osi compiles
# documents through electricity-compiler in debug builds too, so the
# same unoptimized-debug-build stack overflow electricity's own
# `tests/nesting_limit.rs` measured applies here as well.
[profile.dev.package.electricity-yaml]
opt-level = 2
[profile.dev.package.electricity-cel]
opt-level = 2
[profile.dev.package.cel]
opt-level = 2
[profile.dev.package.antlr4rust]
opt-level = 2
