name: c506-reflector-use-child
adapter: scripted
model: test
effects:
  - type: use
    name: child
    inline: |
      effects:
        - type: yield
          name: goal
          template: "Summarize the project."
        - type: reflector
          name: plan_it
          prime_template: "Plan it. Goal: {goal}"
          effects:
            - type: prompt
              name: propose_steps
              template: "propose steps"
