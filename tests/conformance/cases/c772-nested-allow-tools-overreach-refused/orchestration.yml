name: c772-nested-allow-tools-overreach-refused
interface:
  inputs:
    outer_plan:
      type: string
      default: |
        effects:
          - type: yield
            name: seed
            template: "effects:\n  - type: tool\n    name: t\n    provider: docker\n    params:\n      image: alpine\n      args: []\n"
          - type: use
            name: inner
            allow_tools: [docker]
            inline: "{{{prime.seed.value}}}"
effects:
  - type: use
    name: outer
    inline: "{{{input.outer_plan}}}"
