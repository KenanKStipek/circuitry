name: c9-each-tree-max-concurrency
effects:
  - type: tool
    name: seed
    provider: json
    params: {mode: parse, input: "[10, 20, 30, 40]"}
  - type: loop
    name: shots
    flow: tree
    max_concurrency: 2
    each: {in: "prime.seed.value", as: "item"}
    body:
      - type: tool
        name: describe
        provider: json
        params: {mode: stringify, input: {item: "{{item}}"}}
