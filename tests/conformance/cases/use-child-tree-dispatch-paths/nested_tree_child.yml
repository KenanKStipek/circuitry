effects:
  - type: tool
    name: seed
    provider: json
    params: {mode: parse, input: '[1, 2]'}
  - type: loop
    name: outer
    flow: tree
    max_concurrency: 2
    each: {in: "prime.seed.value", as: "o"}
    body:
      - type: loop
        name: inner
        flow: tree
        max_concurrency: 2
        each: {in: "prime.seed.value", as: "i"}
        body:
          - type: tool
            name: leaf
            provider: json
            params: {mode: stringify, input: "{{i}}"}
