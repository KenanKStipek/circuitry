name: c660-error-code-mock
adapter: lmstudio
model: m
effects:
  - type: prompt
    name: greeting
    template: "say hello"
    on_error: continue
  - type: if
    name: guardrail_gate
    if: {mode: cel, expr: "has(state.prime.greeting.meta.error_code) && state.prime.greeting.meta.error_code == 'guardrail_violation'"}
    then:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "then"}}
    else:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "else"}}
