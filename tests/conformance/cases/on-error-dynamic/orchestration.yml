name: on-error-dynamic
effects:
  - type: dynamic
    name: fail_skip
    on_error: skip
    effects:
      - type: tool
        name: body
        provider: json
        params: {mode: parse, input: "not json"}
  - type: dynamic
    name: fail_continue
    on_error: continue
    effects:
      - type: tool
        name: body
        provider: json
        params: {mode: parse, input: "also not json"}
  - type: tool
    name: marker
    provider: json
    params: {mode: stringify, input: {reached: true}}
