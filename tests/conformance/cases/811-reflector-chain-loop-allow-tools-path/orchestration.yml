name: 811-reflector-chain-loop-allow-tools-path
adapter: scripted
model: test
interface:
  inputs:
    items: {type: array, default: [1]}
effects:
  - type: loop
    name: shots
    flow: chain
    each: {in: "input.items", as: "item"}
    body:
      - type: reflector
        name: plan_it
        prime_template: "Plan it. Item: {{item}}"
        effects:
          - type: prompt
            name: propose_steps
            template: "propose steps"
