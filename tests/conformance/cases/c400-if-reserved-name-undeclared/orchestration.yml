name: c400-if-reserved-name-undeclared
effects:
  - type: if
    name: gate
    on_error: continue
    if:
      mode: cel
      expr: "__electricity_strict_eq(1)"
    then: []
    else:
      - type: tool
        name: else_step
        provider: json
        params: {mode: stringify, input: {x: 1}}
  - type: tool
    name: marker
    provider: json
    params: {mode: stringify, input: {reached: true}}
