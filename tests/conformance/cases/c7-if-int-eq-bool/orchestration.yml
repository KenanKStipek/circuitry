name: c7-if-int-eq-bool
effects:
  - type: if
    name: gate
    if:
      mode: cel
      expr: "1 == true"
    then:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "then"}}
    else:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "else"}}
