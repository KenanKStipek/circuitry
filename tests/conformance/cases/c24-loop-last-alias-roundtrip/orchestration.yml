name: c24-loop-last-alias-roundtrip
effects:
  - type: tool
    name: seed
    provider: json
    params: {mode: parse, input: "[1, 2, 3]"}
  - type: loop
    name: shots
    each: {in: "prime.seed.value", as: "item"}
    body:
      - type: tool
        name: step
        provider: json
        params: {mode: stringify, input: {item: "{{item}}"}}
