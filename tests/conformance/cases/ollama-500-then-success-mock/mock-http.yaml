- request:
    method: POST
    path: /api/generate
  response:
    status: 500
    reason: "Internal Server Error"
    headers:
      Content-Type: application/json
    body: '{"error": "overloaded"}'
- request:
    method: POST
    path: /api/generate
  response:
    status: 200
    reason: OK
    headers:
      Content-Type: application/json
    body: '{"response": "hello after retry"}'
