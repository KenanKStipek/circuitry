effects:
  - type: use
    name: missing_required
    on_error: skip
    retries:
      max_attempts: 3
      backoff_ms: 0
    inline: |
      interface:
        inputs:
          name: {type: string, required: true}
      effects:
        - type: tool
          name: step
          provider: json
          params: {mode: stringify, input: {from: input.name}}
