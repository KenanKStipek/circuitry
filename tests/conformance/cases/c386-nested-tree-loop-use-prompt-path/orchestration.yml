name: c386-nested-tree-loop-use-prompt-path
adapter: scripted
model: test
interface:
  inputs:
    items: {type: array, default: [1, 2]}
effects:
  - type: dynamic
    name: fan
    flow: tree
    effects:
      - type: loop
        name: shots
        flow: tree
        each: {in: "input.items", as: "item"}
        body:
          - type: use
            name: child
            inline: |
              effects:
                - type: tool
                  name: seed
                  provider: json
                  params: {mode: parse, input: '[1, 2]'}
                - type: loop
                  name: inner
                  flow: tree
                  each: {in: "prime.seed.value", as: "sub"}
                  body:
                    - type: prompt
                      name: step
                      template: "step for {{sub}}"
