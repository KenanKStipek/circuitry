name: anthropic-messages-mock
adapter: anthropic
model: m
effects:
  - type: prompt
    name: greeting
    messages:
      - role: system
        content: "be terse"
      - role: user
        content: "describe"
      - role: tool
        content: "tool-output"
    assets:
      - kind: image
        ref: "assets/tiny.png"
    params: {max_tokens: 50, stop: ["END"]}
