- request:
    method: POST
    path: /v1/messages
  response:
    status: 200
    reason: OK
    headers:
      Content-Type: application/json
    body: >-
      {"content": [{"type": "text", "text": "hello from anthropic"}], "usage":
      {"input_tokens": 9, "output_tokens": 6}, "stop_reason": "max_tokens"}
