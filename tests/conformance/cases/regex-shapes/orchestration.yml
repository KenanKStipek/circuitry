name: regex-shapes
effects:
  - type: tool
    name: regex_lb
    provider: regex
    params: {pattern: "(?<=foo)bar", input: "foobar", mode: search}
  - type: tool
    name: regex_br
    provider: regex
    params: {pattern: "(\\w+)\\1", input: "hahaha", mode: search}
  - type: tool
    name: match_anchored_not_full
    provider: regex
    params: {pattern: "ab", input: "abc", mode: match}
  - type: tool
    name: match_no_match
    provider: regex
    params: {pattern: "bc", input: "abc", mode: match}
  - type: tool
    name: match_with_groups
    provider: regex
    params: {pattern: "(a)(b)", input: "ab", mode: match}
  - type: tool
    name: match_non_participating_group_is_none
    provider: regex
    params: {pattern: "(a)(b)?", input: "a", mode: match}
  - type: tool
    name: search_no_groups
    provider: regex
    params: {pattern: "\\d+", input: "abc 123", mode: search}
  - type: tool
    name: search_no_match
    provider: regex
    params: {pattern: "z+", input: "abc", mode: search}
  - type: tool
    name: search_non_participating_group_is_none
    provider: regex
    params: {pattern: "(a)|(b)", input: "b", mode: search}
  - type: tool
    name: findall_no_groups
    provider: regex
    params: {pattern: "\\d+", input: "a1 b22", mode: findall}
  - type: tool
    name: findall_one_group
    provider: regex
    params: {pattern: "(\\d+)", input: "a1 b22", mode: findall}
  - type: tool
    name: findall_two_groups_non_participating_is_empty
    provider: regex
    params: {pattern: "(a)|(b)", input: "ab", mode: findall}
  - type: tool
    name: verbose_space_inside_class
    provider: regex
    params: {pattern: "[a b]+", input: "a b", mode: search, flags: [VERBOSE]}
  - type: tool
    name: lowercase_flag_name
    provider: regex
    params: {pattern: "ABC", input: "abc", mode: search, flags: [ignorecase]}
