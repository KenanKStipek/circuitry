name: c513-use-expect-model-reask
adapter: scripted
model: test
effects:
  - type: use
    name: u
    retries: {max_attempts: 2}
    expect:
      mode: model
      template: "is {{value.x}} ok?"
    outputs:
      x:
        path: prime.make.value
    inline: |
      effects:
        - type: tool
          name: make
          provider: json
          params: {mode: stringify, input: 42}
