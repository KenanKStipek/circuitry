name: c386-reflector-generated-prompt
adapter: scripted
model: test
effects:
  - type: yield
    name: goal
    template: "Summarize the project."
  - type: reflector
    name: plan_it
    prime_template: "Plan it. Goal: {{goal}}"
    effects:
      - type: prompt
        name: propose_steps
        template: "propose steps"
