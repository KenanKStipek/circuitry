name: loop-each-empty-collection-no-last
effects:
  - type: tool
    name: seed
    provider: json
    params: {mode: parse, input: "[]"}
  - type: loop
    name: shots
    each: {in: "prime.seed.value", as: "item"}
    body:
      - type: tool
        name: step
        provider: json
        params: {mode: stringify, input: {item: "{{item}}"}}
