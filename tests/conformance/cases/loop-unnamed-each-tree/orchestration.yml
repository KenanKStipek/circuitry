name: loop-unnamed-each-tree
effects:
  - type: tool
    name: seed
    provider: json
    params: {mode: parse, input: "[10, 20]"}
  - type: loop
    flow: tree
    each: {in: "prime.seed.value", as: "item"}
    body:
      - type: tool
        name: x
        provider: json
        params: {mode: stringify, input: "{{item}}"}
