name: loop-retries-inside-body
effects:
  - type: tool
    name: seed
    provider: json
    params: {mode: parse, input: "[1, 2]"}
  - type: loop
    name: shots
    on_error: continue
    each: {in: "prime.seed.value", as: "item"}
    body:
      - type: tool
        name: step
        provider: json
        retries: {max_attempts: 2, backoff_ms: 1}
        expect: {mode: cel, expr: "false"}
        params: {mode: stringify, input: {item: "{{item}}"}}
