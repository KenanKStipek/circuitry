name: split-reduce-json-schema
adapter: scripted
model: m
interface:
  inputs:
    doc: {type: string, required: true}
effects:
  - type: prompt
    name: big
    prompt_type: object
    schema: {type: object, properties: {summary: {type: string}}, required: [summary]}
    split:
      merge:
        template: "Combine: {{#parts}}<{{.}}>{{/parts}}"
    template: "Summarize: {{input.doc}}"
