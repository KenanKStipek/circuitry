name: c11-each-bounds-error-continue
effects:
  - type: tool
    name: seed
    provider: json
    params: {mode: parse, input: "[1, 2, 3]"}
  - type: loop
    name: shots
    max_iterations: 1
    on_error: continue
    each: {in: "prime.seed.value", as: "item"}
    body:
      - type: tool
        name: step
        provider: json
        params: {mode: stringify, input: {item: "{{item}}"}}
  - type: tool
    name: marker
    provider: json
    params: {mode: stringify, input: {ran: true}}
