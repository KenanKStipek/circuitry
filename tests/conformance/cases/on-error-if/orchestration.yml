name: on-error-if
effects:
  - type: if
    name: gate_skip
    on_error: skip
    if:
      mode: cel
      expr: "state.input.missing > 1"
      strict: true
    then:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "then"}}
    else:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "else"}}
  - type: if
    name: gate_continue
    on_error: continue
    if:
      mode: cel
      expr: "state.input.missing > 1"
      strict: true
    then:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "then"}}
    else:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "else"}}
  - type: tool
    name: marker
    provider: json
    params: {mode: stringify, input: {reached: true}}
