name: complexity-depth-use-child
adapter: scripted
model: m
effects:
  - type: use
    name: child
    inline: |
      effects:
        - type: prompt
          name: top_level
          template: "j"
  - type: if
    name: branch
    if:
      mode: cel
      expr: "true"
    then:
      - type: use
        name: nested_child
        inline: |
          effects:
            - type: prompt
              name: inner
              template: "k"
