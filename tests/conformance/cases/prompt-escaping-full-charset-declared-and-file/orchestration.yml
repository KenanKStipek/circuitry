name: prompt-escaping-full-charset-declared-and-file
prompts:
  labeled: "value={{input.x}}"
  fromfile:
    file: fromfile.md
effects:
  - type: tool
    name: via_declared
    provider: json
    params:
      mode: stringify
      input: {text: "{{> labeled}}"}
  - type: tool
    name: via_file
    provider: json
    params:
      mode: stringify
      input: {text: "{{> fromfile}}"}
