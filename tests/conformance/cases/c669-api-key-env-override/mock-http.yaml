- request:
    method: POST
    path: /groq/v1/chat/completions
  response:
    status: 200
    headers:
      Content-Type: application/json
    body: >-
      {"choices": [{"message": {"content": "reply-default"}, "finish_reason": "stop"}],
      "usage": {"prompt_tokens": 1, "completion_tokens": 1}}
