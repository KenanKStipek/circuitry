name: use-inside-if-branch
effects:
  - type: if
    name: gate
    if:
      mode: cel
      expr: "true"
      strict: true
    then:
      - type: use
        name: child
        path: child.yml
    else:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "else"}}
