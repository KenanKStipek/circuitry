- request:
    method: POST
    path: /chat/completions
  response:
    status: 200
    reason: OK
    headers:
      Content-Type: application/json
    body: '{"choices": [{"message": {"content": "yes"}, "finish_reason": "stop"}], "usage": {"prompt_tokens": 1, "completion_tokens": 1}}'
- request:
    method: POST
    path: /chat/completions
  response:
    status: 200
    reason: OK
    headers:
      Content-Type: application/json
    body: '{"choices": [{"message": {"content": "no"}, "finish_reason": "stop"}], "usage": {"prompt_tokens": 1, "completion_tokens": 1}}'
- request:
    method: POST
    path: /chat/completions
  response:
    status: 200
    reason: OK
    headers:
      Content-Type: application/json
    body: '{"choices": [{"message": {"content": "yes"}, "finish_reason": "stop"}], "usage": {"prompt_tokens": 1, "completion_tokens": 1}}'
