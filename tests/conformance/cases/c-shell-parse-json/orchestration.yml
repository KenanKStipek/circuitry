name: c-shell-parse-json
effects:
  - type: tool
    name: report
    provider: shell
    params:
      command: fake
      allowed_commands: [fake]
      args: ["--stdout", "{\"ok\": true, \"items\": [1, 2.5, \"café\"], \"none\": null}"]
      parse: json
  - type: tool
    name: second
    provider: json
    params:
      mode: extract
      input: {from: prime.report.value}
      path: items[2]
