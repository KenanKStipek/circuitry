name: c7-if-float-eq-int
effects:
  - type: if
    name: gate
    if:
      mode: cel
      expr: "1.0 == 1"
    then:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "then"}}
    else:
      - type: tool
        name: branch
        provider: json
        params: {mode: stringify, input: {branch: "else"}}
