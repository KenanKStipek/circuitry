name: loop-unnamed-each-chain
effects:
  - type: tool
    name: seed
    provider: json
    params: {mode: parse, input: "[1, 2, 3]"}
  - type: loop
    each: {in: "prime.seed.value", as: "item"}
    body:
      - type: tool
        name: x
        provider: json
        params: {mode: stringify, input: {item: "{{item}}"}}
