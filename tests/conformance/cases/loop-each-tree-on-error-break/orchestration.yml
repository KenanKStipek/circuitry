name: loop-each-tree-on-error-break
effects:
  - type: tool
    name: seed
    provider: json
    params: {mode: parse, input: "[1, 2, 3]"}
  - type: loop
    name: shots
    flow: tree
    on_error: break
    each: {in: "prime.seed.value", as: "item"}
    body:
      - type: tool
        name: step
        provider: json
        params: {mode: stringify, input: {item: "{{item}}"}}
      - type: tool
        name: gate
        provider: json
        params: {mode: parse, input: "{{item}}"}
        expect: {mode: cel, expr: "value != 2"}
  - type: tool
    name: marker
    provider: json
    params: {mode: stringify, input: {ran: true}}
