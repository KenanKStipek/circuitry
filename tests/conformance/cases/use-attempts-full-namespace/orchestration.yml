name: use-attempts-full-namespace
effects:
  - type: use
    name: theme
    inline: |
      effects:
        - type: tool
          name: bump
          provider: fs
          params: {mode: append, path: "scratch/counter.txt", content: x}
        - type: tool
          name: tally
          provider: fs
          params: {mode: read, path: "scratch/counter.txt"}
        - type: if
          if: {mode: cel, expr: "state.prime.tally.value == 'x'"}
          then:
            - type: tool
              name: first_only
              provider: json
              params: {mode: stringify, input: first-only}
    retries: {max_attempts: 2, backoff_ms: 0}
    expect: "state.prime.theme.tally.value == 'xx'"
finally:
  - type: tool
    name: cleanup
    provider: fs
    params: {mode: delete, path: "scratch", recursive: true}
