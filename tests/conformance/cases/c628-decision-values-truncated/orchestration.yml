name: c628-decision-values-truncated
effects:
  - type: tool
    name: big
    provider: json
    params: {mode: parse, input: '{"blob": ""}'}
  - type: if
    name: gate
    if:
      mode: cel
      expr: "state.prime.big.value.blob != ''"
    then:
      - type: tool
        name: yes_branch
        provider: json
        params: {mode: stringify, input: {ok: true}}
    else: []
