[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitry-cof"
version = "0.1.0"
description = "Circuitry — Cybernetic Orchestration Framework (COF) for LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenan Stipek", email = "kenan@stipek.org" }]
keywords = [
    "llm",
    "orchestration",
    "cybernetics",
    "agents",
    "yaml",
    "ollama",
    "openai",
    "anthropic",
    "litellm",
    "comfyui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "chevron>=0.14",
    "python-dotenv>=1.0",
    "ollama>=0.1.8",
    "simpleeval>=0.9.13",
]

[project.optional-dependencies]
toon = ["toon-format @ git+https://github.com/toon-format/toon-python.git"]

[project.scripts]
cof = "circuitry.cli.app:main"

[project.urls]
Homepage = "https://github.com/kenankstipek/circuitry"
Repository = "https://github.com/kenankstipek/circuitry"
Issues = "https://github.com/kenankstipek/circuitry/issues"
Discussions = "https://github.com/kenankstipek/circuitry/discussions"
Changelog = "https://github.com/kenankstipek/circuitry/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require local runtime dependencies (opt-in)",
]
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["circuitry"]
omit = ["src/circuitry/bundled/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__."]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
circuitry = [
    "schema/*.json",
    "bundled/orchestrations/*.yml",
    "bundled/docs/*.md",
    "bundled/docs/plugins/*.md",
    "bundled/rules/*.yml",
]
