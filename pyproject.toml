[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitry-cof"
version = "0.1.0"
description = "Circuitry — Cybernetic Orchestration Framework (COF) for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenan Stipek", email = "kenan@stipek.org" }]
keywords = [
    "llm",
    "orchestration",
    "cybernetics",
    "agents",
    "yaml",
    "ollama",
    "openai",
    "anthropic",
    "litellm",
    "comfyui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "chevron>=0.14",
    "python-dotenv>=1.0",
    "ollama>=0.1.8",
    "simpleeval>=0.9.13",
    # 2.0 renamed FastMCP -> MCPServer and moved it to mcp.server.mcpserver;
    # src/circuitry/mcp/server.py targets that API, so 1.x will not import.
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
toon = ["toon-format @ git+https://github.com/toon-format/toon-python.git"]

# Terminal UI. `cof tui` (and a bare `cof` on a TTY) needs this; every
# other subcommand works without it.
tui = ["textual>=1.0"]

# Per-tool optional deps. Each plugin's check() method reports
# library:<dep> when the corresponding dep is missing.
dns = ["dnspython>=2.4"]
whois = ["python-whois>=0.9"]
pdf_extract = ["pdfplumber>=0.10"]
xml = ["lxml>=4.9"]
html_extract = ["beautifulsoup4>=4.12", "lxml>=4.9"]
psutil = ["psutil>=5.9"]
wikipedia = ["wikipedia-api>=0.6"]
rss = ["feedparser>=6.0"]
webhook = ["requests>=2.28"]
web_fetch = ["requests>=2.28", "trafilatura>=1.6"]
python_eval = ["RestrictedPython>=7.0"]

# SaaS / messaging integrations.
slack = ["slack-sdk>=3.21"]
discord = ["discord.py>=2.3"]
github = ["PyGithub>=2.1"]
jira = ["atlassian-python-api>=3.41"]
notion = ["notion-client>=2.0"]
linear = ["requests>=2.28"]

# Cloud SaaS.
gcalendar = ["google-api-python-client>=2.100", "google-auth>=2.20"]
gdrive = ["google-api-python-client>=2.100", "google-auth>=2.20"]
"s3-tool" = ["boto3>=1.28"]

# Browser automation.
playwright = ["playwright>=1.40"]
screenshot = ["playwright>=1.40"]

# ML / embeddings / vector search. These pull in heavy transitive deps
# (PyTorch, transformers, ONNX, tokenizers); installing takes minutes
# and several GB of disk.
embed = ["sentence-transformers>=2.2"]
rerank = ["sentence-transformers>=2.2"]
vector_search = ["chromadb>=0.4"]

# SQL B-prime persistence runtime plugins. sqlite uses stdlib so no
# extra is required. The remaining six dialects each ship as their own
# extra; install only what your deployment needs.
postgres = ["psycopg2-binary>=2.9"]
cockroachdb = ["psycopg2-binary>=2.9"]
mysql = ["mysql-connector-python>=8.0"]
duckdb = ["duckdb>=0.9"]
mssql = ["pyodbc>=5.0"]
clickhouse = ["clickhouse-connect>=0.7"]

# Document / KV / object / append-log persistence runtime plugins.
# jsonl-file uses stdlib only (no extra required).
mongodb = ["pymongo>=4.0"]
dynamodb = ["boto3>=1.28"]
firestore = ["google-cloud-firestore>=2.13"]
couchdb = ["requests>=2.28"]
elasticsearch = ["elasticsearch>=8.10"]
opensearch = ["opensearch-py>=2.4"]
redis = ["redis>=5.0"]
memcached = ["pymemcache>=4.0"]
"s3-runtime" = ["boto3>=1.28"]
gcs = ["google-cloud-storage>=2.10"]
"azure-blob" = ["azure-storage-blob>=12.18", "azure-identity>=1.15"]
r2 = ["boto3>=1.28"]

# Pub/sub + observability runtime plugins.
kafka = ["confluent-kafka>=2.3"]
rabbitmq = ["pika>=1.3"]
nats = ["nats-py>=2.6"]
opentelemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
sentry = ["sentry-sdk>=1.40"]
datadog = ["datadog>=0.47"]
honeycomb = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
prometheus = ["prometheus-client>=0.19"]
loki = ["requests>=2.28"]
cloudwatch = ["boto3>=1.28"]

# Aggregate: pulls in every tool extra from this batch.
tools = [
    "dnspython>=2.4",
    "python-whois>=0.9",
    "pdfplumber>=0.10",
    "lxml>=4.9",
    "beautifulsoup4>=4.12",
    "psutil>=5.9",
    "wikipedia-api>=0.6",
    "feedparser>=6.0",
    "requests>=2.28",
    "trafilatura>=1.6",
    "RestrictedPython>=7.0",
]

# Aggregate including SDK-heavy plugins.
tools-all = [
    "circuitry-cof[tools]",
    "slack-sdk>=3.21",
    "discord.py>=2.3",
    "PyGithub>=2.1",
    "atlassian-python-api>=3.41",
    "notion-client>=2.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "boto3>=1.28",
    "playwright>=1.40",
]

[project.scripts]
cof = "circuitry.cli.app:main"
circuitry-mcp = "circuitry.mcp.server:main"

[project.urls]
Homepage = "https://github.com/kenankstipek/circuitry"
Repository = "https://github.com/kenankstipek/circuitry"
Issues = "https://github.com/kenankstipek/circuitry/issues"
Discussions = "https://github.com/kenankstipek/circuitry/discussions"
Changelog = "https://github.com/kenankstipek/circuitry/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require local runtime dependencies (opt-in)",
]
addopts = ["--strict-markers"]

[tool.ruff.lint]
# Ruff's *default* rule set is not stable across releases: 0.16 promoted
# several hundred rules into it and turned a green tree into 413 findings
# without a single line of our code changing. Selecting explicitly makes
# rule adoption a deliberate, reviewable commit instead of something a
# `pip install -U ruff` can do to CI.
select = [
    "E4", "E7", "E9", # pycodestyle errors (E501 line length: see ignore)
    "F",              # pyflakes
    "W",              # pycodestyle warnings
    "I",              # isort — import ordering
    "UP",             # pyupgrade — modern syntax for our floor (3.10)
    "B",              # flake8-bugbear
    "C4",             # flake8-comprehensions
    "SIM",            # flake8-simplify
    "RET",            # flake8-return
    "PIE",            # flake8-pie
    "ISC",            # flake8-implicit-str-concat
    "LOG", "G",       # logging correctness / format style
    "DTZ",            # flake8-datetimez — naive datetimes are a real bug class
    "ASYNC",          # flake8-async
    "YTT",            # flake8-2020 — sys.version comparisons
    "FLY",            # flynt — static str.join
    "PERF",           # perflint
    "FURB",           # refurb
    "RUF",            # ruff-specific
    "PLE", "PLW",     # pylint errors + warnings (PLC/PLR are mostly style)
]
ignore = [
    # Line length. The codebase wraps by hand at a soft ~88 and reflowing
    # 295 lines would bury real review signal; no formatter is enforced
    # here, so this stays a convention rather than a gate.
    "E501",
    # Typer's whole CLI idiom is `arg: T = typer.Option(...)` in the
    # signature. flake8-bugbear's immutable-call allowlist covers our own
    # helpers (see [tool.ruff.lint.flake8-bugbear]) but Typer's dynamic
    # re-export shapes still trip it across cli/app.py.
    "B008",
    # `try/except: pass` -> `contextlib.suppress` reads worse in the tight
    # best-effort cleanup paths (thread joins, temp-file unlink) where it
    # fires, and adds an import + a context manager per site.
    "SIM105",
    # Nested `with` -> single parenthesized `with`. Mostly fires in tests
    # where the nesting documents which patch belongs to which assertion.
    "SIM117",
    # try/except inside a loop. Per-item error isolation is the point in
    # the plugin dispatch and per-branch run loops; hoisting it out would
    # change semantics, not just shape.
    "PERF203",
    # Module-level singletons (`_manager`, plugin registries) are set
    # through `global` by design and are covered by tests.
    "PLW0603",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
# The plugin catalog lazy-imports a wide set of optional third-party
# packages (boto3, pymongo, requests, lxml, sentence-transformers, ...)
# whose stubs we don't ship as deps. Skipping those imports keeps the
# typecheck focused on code we own.
ignore_missing_imports = true
# ``import-untyped`` reports "Library stubs not installed for X" even
# when the import resolves — common for ``requests`` etc. Plugin
# integrations don't gain enough from third-party stubs to justify
# adding them to the lint env.
disable_error_code = ["import-untyped"]
# Pre-existing core modules have non-trivial type debt; checking them
# strictly gates new work on a separate cleanup. Track explicit
# exemptions per-module rather than disabling globally so newly-added
# files default to checked.
exclude = [
    "^src/circuitry/core/loop\\.py$",
    "^src/circuitry/core/compiler\\.py$",
    "^src/circuitry/core/conditional\\.py$",
    "^src/circuitry/core/dynamic\\.py$",
    "^src/circuitry/core/prompt\\.py$",
    "^src/circuitry/core/tool\\.py$",
    "^src/circuitry/mcp/runs\\.py$",
]

[tool.coverage.run]
source = ["circuitry"]
omit = ["src/circuitry/bundled/*", "src/circuitry/curation/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__."]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
circuitry = [
    "schema/*.json",
    "curation/**/*.yml",
    "curation/**/*.json",
    "curation/**/*.md",
    "bundled/docs/*.md",
    "bundled/docs/plugins/*.md",
    "bundled/rules/*.yml",
]
